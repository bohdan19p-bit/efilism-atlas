-08", "ARG-09"], "conclusion": "Ожидание будущего благополучия само по себе не оправдывает серьёзный навязанный риск.", "limit": "Не исключает добровольные и безопасные меры помощи или прогресс.", "remaining": "Оценивать конкретные утверждения о будущем, не выводить невозможность прогресса.", "pages": [86, 88, 369, 374]}, {"id": "ARG-11", "title": "Независимость критерия от субстрата", "status": "conditional", "direct": [], "transitive": [], "conclusion": "Если неднк-система способна переживать вред, её интересы подлежат этическому учёту.", "limit": "Не выводит сознание из вычислений и не лицензирует вред существующим системам.", "remaining": "Обосновать равный учёт сопоставимых интересов и соразмерный подход при неопределённости.", "pages": [173, 275, 278, 374]}, {"id": "ARG-12", "title": "Частичные решения и этика помощи", "status": "conditional", "direct": [], "transitive": [], "conclusion": "Успех локального снижения вреда сам по себе не доказывает допустимость создания новых субъектов.", "limit": "Не принижает этическую значимость помощи, охраны среды или благополучия животных.", "remaining": "Для каждого перехода установить связующую посылку и оценить последствия для существующих субъектов.", "pages": [336, 337, 338, 341]}, {"id": "ARG-13", "title": "От феноменального факта к объективной ценности", "status": "normative_open", "direct": ["ARG-01"], "transitive": ["ARG-01"], "conclusion": "Отрицательное переживание может быть объективно установимым неблагоприятным состоянием субъекта.", "limit": "Не выводит категорическую обязанность из физического факта.", "remaining": "Защитить внутреннюю неблагоприятность независимо от произвольной оценки; не считать её автоматически решающей.", "pages": [185, 193, 196, 205, 207]}, {"id": "ARG-14", "title": "Долг рациональности и гильотина Юма", "status": "normative_open", "direct": ["ARG-13", "ARG-06"], "transitive": ["ARG-01", "ARG-06", "ARG-13"], "conclusion": "Предотвращение необязательного тяжёлого вреда является обоснованной практической задачей; безусловность запрета требует дальнейших посылок.", "limit": "Это условная реконструкция, не доказательство дедукции должного из чисто описательных фактов.", "remaining": "Обосновать авторитет H1/H2 через теории нормативных оснований; отдельно решить конфликт оснований.", "pages": [238, 239, 243, 244, 261]}, {"id": "ARG-15", "title": "Error Prime: космологический уровень", "status": "normative_open", "direct": ["ARG-06"], "transitive": ["ARG-06"], "conclusion": "Error Prime можно исследовать как философское обозначение космологической предпосылки проблемы; оценочная квалификация не следует из безличности сама по себе.", "limit": "Не физическая теория и не утверждение о виновности неживой материи.", "remaining": "Защитить критерий переноса оценочного предиката на космологическое целое; не выдавать метафору за физический факт.", "pages": [195, 198, 199, 200, 502]}, {"id": "ARG-16", "title": "Квазипозитивность как сильный эмпирический тезис", "status": "empirical_open", "direct": ["ARG-05"], "transitive": ["ARG-05"], "conclusion": "Компенсаторный механизм поддерживает ограниченный тезис о части благ; универсальная квазипозитивность остаётся исследуемой гипотезой.", "limit": "Требуется независимая научная проверка; ограниченный аргумент ARG-05 от неё не зависит.", "remaining": "Нужна независимая проверка универсальности; нейронаучное различение liking/wanting само по себе не опровергает все версии тезиса.", "pages": [211, 215, 217, 218, 219]}, {"id": "ARG-17", "title": "Двойной предохранитель: два эффекта несоздания", "status": "conditional", "direct": ["ARG-07"], "transitive": ["ARG-07"], "conclusion": "Несоздание предотвращает его возможный вред без причинения ему переживаемого лишения благ.", "limit": "Область — добровольное несоздание; не техническая гарантия или разрешение причинять вред.", "remaining": "Отдельно рассмотреть внешние последствия и конкурирующие аксиологии; никакого вывода о допустимости вреда живущим.", "pages": [225, 248, 412, 441, 446]}, {"id": "ARG-18", "title": "Синтез: условное обоснование абсолютного антинатализма", "status": "synthesis_open", "direct": ["ARG-02", "ARG-07", "ARG-08", "ARG-09", "ARG-11", "ARG-14", "ARG-17"], "transitive": ["ARG-01", "ARG-02", "ARG-06", "ARG-07", "ARG-08", "ARG-09", "ARG-11", "ARG-13", "ARG-14", "ARG-17"], "conclusion": "Абсолютный антинатализм следует условно при обосновании универсального условия запрета и его применимости.", "limit": "Это карта доказательных обязательств, не завершённое доказательство. Только добровольный отказ от создания; не оправдывает насилие или вред существующим.", "remaining": "Проверить универсальный квантор и все исключения; учитывать автономию, добровольность и защиту существующих субъектов.", "pages": [261, 273, 274, 278, 451]}], "clusters": [{"id": "SYS-01", "priority": "P1", "title": "Объективная ценность и локальная антиценность", "address": "§23.2; §21.2; §30.6.1", "decision": "исследовать", "plan": "Отдельно защищать внутреннюю неблагоприятность мучительного аспекта опыта; различить фактическую, реляционную, аксиологическую и нормативную объективность. Не объявлять тождество естественного и ценностного свойств доказанным.", "acceptance": "Развести истинность факта, ценностную гипотезу и практическое основание; ответить на конкурирующее объяснение.", "source_ids": ["CON:R01", "J01", "ME01", "ME02", "OV27-01", "OV27-03", "PH30-06"]}, {"id": "SYS-02", "priority": "P1", "title": "Нормативный мост и защитное ограничение", "address": "§30.6.1; §32.4.2", "decision": "исследовать", "plan": "Сохранить существующий двухступенчатый мост. Отдельно обосновать первоначальный вес вреда и более сильное ограничение на навязывание существенного риска при чистом создании. Равный учёт — самостоятельная посылка, а не результат одного физикализма.", "acceptance": "Предъявить независимые основания обеих ступеней; не выдавать условную валидность за доказательство посылки.", "source_ids": ["CON:R02", "LAC-S05", "J02", "J04", "ME03", "OV27-05", "E05"]}, {"id": "SYS-03", "priority": "P1", "title": "Долг рациональности и метарациональность", "address": "§4.6; §30.6.1", "decision": "исследовать", "plan": "Различить проверку применения критерия и обоснование самого критерия. Внутренняя непоследовательность не доказывает безусловную обязанность принять оспариваемую норму.", "acceptance": "Дать отдельный ответ на отказ от критерия, не повторяя его в качестве посылки.", "source_ids": ["CON:R05", "HER:10", "J03", "EP28-04"]}, {"id": "SYS-04", "priority": "P1", "title": "Область абсолютности", "address": "§33.4.4; §33.5.4; §32.4.2", "decision": "авторское решение", "plan": "Сохранить принятое определение эфилизма как философии абсолютного антинатализма. Раздельно представить универсальность критерия, условия его применимости и объём доказанного заключения. Не считать отсутствие доказанного запрета разрешением, и наоборот.", "acceptance": "Автор определяет, означает ли абсолютность универсальный стандарт или безусловный запрет; второй вариант требует самостоятельного доказательства охвата.", "source_ids": ["CON:R09", "LAC-S06", "HER:14", "J05", "ME05"]}, {"id": "SYS-05", "priority": "P1", "title": "Согласие, авторизация и чистое создание", "address": "§31.3; §32.4.2", "decision": "уточнить", "plan": "Развести действительное согласие, невозможность его получить, последующее одобрение и самостоятельные основания авторизации. Оценка создания не даёт полномочий принуждать других.", "acceptance": "Различены создание, добровольный выбор и помощь существующему субъекту; нет ретроспективной подмены согласия.", "source_ids": ["CON:R03", "PROF:03", "E03"]}, {"id": "SYS-06", "priority": "P1", "title": "Предохранитель, неопределённость и бремя доказательства", "address": "§32.1–4; приложение A", "decision": "уточнить", "plan": "Различить установленную возможность вреда, неизвестность и структурное исключение риска. Эпистемическое бремя симметрично, практическое определяется интересами и последствиями конкретного действия или бездействия.", "acceptance": "Не выводить запрет из незнания; не выводить разрешение из отсутствия доказанного запрета.", "source_ids": ["CON:R04", "E06"]}, {"id": "SYS-07", "priority": "P1", "title": "Профилактика, коррекция и совместимость обязанностей", "address": "§29–30; глава 48; приложение A", "decision": "уточнить", "plan": "Сохранить двойной предохранитель в контексте добровольного несоздания и различить его с помощью существующим субъектам. Проверять совместимость требований; уважать достоинство, автономию и безопасность существующих субъектов.", "acceptance": "Ни один вывод о создании не становится основанием вредить существующим субъектам; конфликт требований не скрыт.", "source_ids": ["CON:R08", "HER:12", "E01", "E02", "E07"]}, {"id": "SYS-08", "priority": "P1", "title": "Несравнительный вред и неидентичность", "address": "§33.3.4", "decision": "уточнить", "plan": "Разграничить причинное участие, фактическую неблагоприятность, сравнительное ухудшение и нарушение нормы.", "acceptance": "Каждая оценка имеет собственный критерий; не предполагается сравнение переживания с несуществованием.", "source_ids": ["CON:R10", "E04"]}, {"id": "SYS-09", "priority": "P2", "title": "Квазипозитивность и нулевая сумма", "address": "§26.1–3; §33.5.4; PDF 191", "decision": "уточнить", "plan": "Различить функциональную зависимость, феноменальный дефицит и буквальный количественный баланс. Согласовать сильные формулировки главы 22 с главой 26; не объявлять всякое удовольствие снятием переживаемого дефицита.", "acceptance": "Критика создания не зависит от недоказанного универсального нулевого баланса.", "source_ids": ["CON:R07", "SUP:A08", "LAC-S03", "PH30-04"]}, {"id": "SYS-10", "priority": "P2", "title": "Соизмеримость, агрегирование и компенсация", "address": "§26.5; §27; приложение A", "decision": "добавить пример", "plan": "Вставить пример независимого масштабирования индивидуальных оценок (2b−a). Отдельно различить неотменимость прошлого вреда, компенсацию и нормативную допустимость действия.", "acceptance": "Сумма не подменяет права; пример не объявлен эмпирической невозможностью всякого сравнения.", "source_ids": ["SUP:A09", "PROF:04", "OV27-04"]}, {"id": "SYS-11", "priority": "P2", "title": "Первичный факт и Первичная Ошибка", "address": "§7.4; §10.5–7; §24.1–4", "decision": "перекрёстная ссылка", "plan": "Первичный факт — исторический вопрос о предельном основании; Первичная Ошибка — оценочный диагноз причинной архитектуры. Не отождествлять фундаментальность, уникальность и необходимость.", "acceptance": "Одна краткая справка и перекрёстная ссылка; не новая глава и не космологическая теорема.", "source_ids": ["CON:R06", "SUP:O07", "LAC-S01", "HER:04", "HER:05", "PROF:01", "MP29-03", "MP29-05"]}, {"id": "SYS-12", "priority": "P2", "title": "Тождество и устойчивость ценности", "address": "§21; §23.2", "decision": "уточнить", "plan": "Устойчивость истинности утверждения о состоявшемся эпизоде не означает неизменность текущего опыта или общей единицы его интенсивности.", "acceptance": "Не подменять объективность количественной измеримостью.", "source_ids": ["SUP:C05", "LAC-S02", "HER:08", "PROF:02", "OV27-02"]}, {"id": "SYS-13", "priority": "P2", "title": "Замкнутое понятие и объяснительный аудит", "address": "§4.2–13", "decision": "добавить пример", "plan": "Сохранить специальное значение анализандума с терминологической оговоркой. Различить объяснение, решение и область достаточности; добавить пример двух гипотез с одинаковым правдоподобием наблюдения к существующему аудиту.", "acceptance": "Один пример, а не второй протокол; не приписывать академическим терминам специальное значение без маркировки.", "source_ids": ["SUP:E06", "LAC-S04", "HER:01", "HER:02", "HER:03", "PROF:05", "EP28-02", "EP28-05"]}, {"id": "SYS-14", "priority": "P2", "title": "Истина, феноменальный факт и отчёт", "address": "§1.2; §2.4; §21.2; §23.2", "decision": "сохранить", "plan": "Сохранить различие истины, обоснованности и уверенности; уточнить границы самоприменения релятивизма и безошибочности самоотчёта.", "acceptance": "Отсутствие знания не отождествляется с отсутствием факта.", "source_ids": ["HER:06", "EP28-01"]}, {"id": "SYS-15", "priority": "P2", "title": "Нигилизм и нормативный разрыв", "address": "§23.5; §25; §30.6.1", "decision": "уточнить", "plan": "Разделить апелляцию к естественности, разрыв Юма, проблему Мура и нигилистическую контраргументацию. Снятие аргумента за разрешённость не доказывает запрет.", "acceptance": "Негативная критика не выдается за позитивное обоснование нормы.", "source_ids": ["HER:11", "HER:13", "PROF:06"]}, {"id": "SYS-16", "priority": "P2", "title": "Физикализм, законы и уровни организации", "address": "§7.4–7.7; §8; §9; §11.4", "decision": "добавить пример", "plan": "Сохранить различие физикализма и детерминизма. Использовать контрмодель перестановки кванторов и пример макроуровня; хаотическую динамику поместить в иллюстрации.", "acceptance": "Не выводить конкретные необходимые законы или единственную интерпретацию квантовой механики.", "source_ids": ["MP29-01", "MP29-02", "MP29-04", "MP29-06"]}, {"id": "SYS-17", "priority": "P2", "title": "Сентиентность и нейрофилософские модели", "address": "§19–21", "decision": "уточнить", "plan": "Различать ноцицепцию и опыт, индикаторы и сам опыт; феноменальная прозрачность не равна истинности. Уточнить атрибуцию Метцингеру и не выдавать модели сознания за завершённые.", "acceptance": "Проверить первоисточник Метцингера и актуальность исследования Cogitate до публикации.", "source_ids": ["HER:07", "HER:09", "PH30-01", "PH30-02", "PH30-03"]}, {"id": "SYS-18", "priority": "P2", "title": "Численное тождество субъекта", "address": "PDF 177; §20", "decision": "уточнить", "plan": "Заменить двусмысленное «то же Я» на качественно сходный тип уязвимости, если контекст подтверждает этот смысл.", "acceptance": "Проверить оригинальную фразу и соседние абзацы; не выводить общую субъективность из сходства.", "source_ids": ["PH30-05"]}, {"id": "SYS-19", "priority": "P2", "title": "Абиогенез и причинная логика отбора", "address": "§14.7; §15.3; глава 16", "decision": "добавить пример", "plan": "Уточнить гипотетичность исторических сценариев; показать уравнение Прайса как пример отсутствия гарантии роста благополучия, не как доказательство его неизбежного снижения.", "acceptance": "Отделить репродуктивный успех от благополучия, проверить научные ссылки.", "source_ids": ["BIO31-01", "BIO31-02", "BIO31-03"]}, {"id": "SYS-20", "priority": "P2", "title": "Нужда, биологическая функция и первичная дисфункция", "address": "§17–19; PDF 155; §24", "decision": "уточнить", "plan": "Различить функциональное нарушение, структурную уязвимость и специальный оценочный диагноз; ограничить универсализации о гомеостазе, аллостазе и конфликтах.", "acceptance": "Сохранить реальные кооперативные процессы и различие функциональной нужды и переживаемого вреда.", "source_ids": ["BIO31-04", "BIO31-05", "BIO31-06", "BIO31-07"]}, {"id": "SYS-21", "priority": "P2", "title": "Симметрия когнитивного аудита", "address": "§3.3; §34.1–4; §28.1", "decision": "добавить пример", "plan": "Проверять качество свидетельств и симметрию критериев; отделить оптимистическое и негативное смещения от нормативного веса риска. Привести калибровку и тест смены групповой метки как инструменты атласа.", "acceptance": "Не диагностировать убеждения по содержанию вывода; не применять формальные примеры как психометрический тест.", "source_ids": ["ME04", "EP28-03", "PSY32-01", "PSY32-04", "PSY32-07"]}, {"id": "SYS-22", "priority": "P2", "title": "Рационализация и гипернормализация", "address": "§34.3–4; PDF 293", "decision": "уточнить", "plan": "Развести конфабуляцию, рационализацию, обман и нормализацию. Заменить категорические психологические атрибуции проверяемыми гипотезами.", "acceptance": "Для конкретного случая требуются независимые свидетельства; частота не означает допустимость.", "source_ids": ["PSY32-02", "PSY32-03", "PSY32-06"]}, {"id": "SYS-23", "priority": "P3", "title": "Социальные нормы и парохиализм", "address": "§35.1; §30.1", "decision": "проверить источник", "plan": "Добавить исследования Neal & Watling Neal как ограниченные свидетельства групповых оценок, не отождествляя добровольную бездетность с антинатализмом.", "acceptance": "Проверить выборку, эффект и репликацию; не обобщать на всё человечество.", "source_ids": ["PSY32-05"]}, {"id": "SYS-24", "priority": "P3", "title": "Терминология рисков", "address": "глава 46; справочный аппарат", "decision": "проверить источник", "plan": "Разграничить риски масштабного страдания и экзистенциальные риски как пересекающиеся, но не тождественные категории. Сохранить оценку безопасности, автономии и благополучия существующих субъектов.", "acceptance": "Проверить дефиниции по первоисточникам; не выводить практических разрешений из классификации.", "source_ids": ["LAC-S07"]}], "source_recommendations": [{"id": "CON:R01", "module": "consolidatio", "title": "Реляционная антиценность: критерий и основание", "address": ["MON26:P184", "MON26:P193", "MON26:P239"], "text": "Отрицательное переживание квалифицируется здесь как неблагоприятный аспект состояния именно для его носителя. Эта квалификация не зависит от одобрения наблюдателя и не является оценкой стимула во всех контекстах. Локальная антиценность не тождественна оценке биографии или итоговой допустимости действия. Натуралистическое объяснение такой антиценности — самостоятельная аксиологическая позиция, а не следствие одного определения физического события.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R02", "module": "consolidatio", "title": "Двухступенчатый нормативный мост", "address": ["MON26:P238", "MON26:P239", "MON26:P243", "MON26:P244", "MON26:P261"], "text": "Первый нормативный переход устанавливает первоначальное практическое основание против причинения вреда. Второй вводит самостоятельное ограничение на обмен крайнего риска для одного субъекта на благо другого. Первое основание не превращается во второе вследствие одного лишь увеличения интенсивности вреда: для этого требуется защитный принцип. Рациональность проверяет непротиворечивость применения обоих положений, но не заменяет их содержательного обоснования.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R03", "module": "consolidatio", "title": "Граница чистого создания и опекунского конфликта", "address": ["MON26:P261", "MON26:P273", "MON26:P444", "MON26:P450", "MON26:P451"], "text": "Чистым созданием в данном аргументе называется создание нового субъекта, для которого отсутствует независимо обоснованная необходимость этого действия в защиту уже существующего притязания. Утверждение о такой необходимости проверяется отдельно: кто является носителем притязания, почему оно не создано самим решением и существуют ли менее обременительные альтернативы. Наличие опекунского конфликта не является автоматическим оправданием создания; оно обозначает иной контекст оценки. Разрешение помощи одному субъекту не переносится на создание другого или на принуждение.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R04", "module": "consolidatio", "title": "Предохранитель и статус недоказанной безопасности", "address": ["MON26:P225", "MON26:P261", "MON26:P273", "MON26:P278", "MON26:P450", "MON26:P451"], "text": "Следует различать установленную причинную возможность защищённого крайнего проигрыша, неразрешённую неопределённость и структурное исключение такого проигрыша. Недостаток сведений не эквивалентен ни установленному риску, ни доказанной безопасности. Специальный доказательный долг означает необходимость независимой проверки профиля риска; отсутствие окончательной оценки само по себе не является ни разрешением, ни доказанным запретом. При установленных условиях защитного порога запрет следует условно из принятого принципа.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R05", "module": "consolidatio", "title": "Долг и предписание рациональности", "address": ["MON26:P227", "MON26:P238", "MON26:P243", "MON26:P244"], "text": "Долг рациональности означает требование учитывать доступные и релевантные практические основания, а предписание рациональности — требование корректировать убеждения, цели и способы действия в соответствии с обоснованными критериями. Успешное достижение цели не доказывает её оправданности. В этическом рассуждении проверка целей не создаёт нормативное основание из факта биологической мотивации: она предполагает независимо предъявленный критерий оценки.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R06", "module": "consolidatio", "title": "Первичная Ошибка: причинная глубина и оценочный диагноз", "address": ["MON26:P193", "MON26:P199", "MON26:P200", "MON26:P502"], "text": "Первичность указывает на уровень причинных условий, а ошибочность — на их оценку относительно критерия переживаемого вреда. Номологическое описание и оценочный диагноз относятся к разным уровням анализа. Отсутствие замысла само по себе не является вредом, и термин не предполагает, что Вселенная нарушила заранее заданную цель. Биологическая дисфункция выступает частным уровнем причинного анализа, а не синонимом Первичной Ошибки.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R07", "module": "consolidatio", "title": "Квазипозитивность: независимость этического вывода", "address": ["MON26:P215", "MON26:P217", "MON26:P218", "MON26:P245", "MON26:P278"], "text": "Функциональная зависимость положительного опыта от регуляторной архитектуры не тождественна феноменологическому тезису о прекращении каждого отрицательного переживания. Даже признание самостоятельных положительных переживаний не решает вопроса первоначальной авторизации риска. Условная метафора нулевой суммы не заменяет измерения общего баланса, а положительный баланс, если он установлен, не заменяет обоснования защитного принципа.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R08", "module": "consolidatio", "title": "Двойной предохранитель: два уровня коррекции", "address": ["MON26:P225", "MON26:P248", "MON26:P446"], "text": "Двойная коррекция означает устранение уже существующей проблемы и предотвращение повторного возникновения той же проблемы. Асимметрия несоздания относится к отсутствию нового носителя вреда и отсутствию лишения у несуществующего получателя. Эти рассуждения могут поддерживать общую профилактическую ориентацию, но имеют разные посылки. При применении средств к существующим субъектам сохраняется самостоятельная проверка их допустимости, согласия и соразмерности.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R09", "module": "consolidatio", "title": "Область универсальности и определение эфилизма", "address": ["MON26:P273", "MON26:P274", "MON26:P278", "MON26:P451", "MON26:P502"], "text": "Абсолютность антинатализма в философии эфилизма выражает универсальность этической области: критерий не зависит от вида, субстрата, места или эпохи. Категоричность запрета для всех случаев в этой области требует отдельно установить универсальность применимых посылок. Там, где предпосылка защищённого крайнего проигрыша не установлена, её нельзя подменять одним названием философии. Это разграничение описывает доказательный статус заключения, а не меняет историческое самоопределение эфилизма.", "draft": "", "source_file": "consolidatio.json"}, {"id": "CON:R10", "module": "consolidatio", "title": "Генеалогическая прозрачность и несравнительный вред", "address": ["MON26:P193", "MON26:P238", "MON26:P248", "MON26:P502"], "text": "При оценке создания необходимо различать причинную ответственность за переживаемый вред, сравнительное ухудшение относительно доступной альтернативы и отдельное нормативное основание против назначения риска. Невозможность сравнить биографию конкретного субъекта с его несуществованием не устраняет факт неблагоприятного опыта, но не устанавливает сама по себе неправомерность действия. Несравнительный подход представляет самостоятельный философский инструмент для анализа такого случая.", "draft": "", "source_file": "consolidatio.json"}, {"id": "SUP:O07", "module": "concordantia", "title": "CON:O07", "address": "Глава 10, PDF 120–121", "text": "Добавить короткую перекрёстную ссылку на главу 24.", "draft": "Первичный факт (Fact Prime) в исторической Вики обозначает предполагаемое предельное основание номологического порядка. Вопрос о его единственности остаётся открытым. Его нельзя отождествлять с Первичной Ошибкой, которая является оценочным диагнозом.", "source_file": "concordantia.json"}, {"id": "SUP:C05", "module": "concordantia", "title": "CON:C05", "address": "Главы 21 и 23, PDF 185, 193", "text": "Вставка только если при редакторской сверке не найден эквивалент.", "draft": "Объективность состоявшегося переживания не равнозначна постоянству его интенсивности. Различие переживаний разных субъектов не отменяет фактичности каждого из них и само по себе не обеспечивает их количественной соизмеримости.", "source_file": "concordantia.json"}, {"id": "SUP:A08", "module": "concordantia", "title": "CON:A08", "address": "Глава 26, PDF 196, 218", "text": "Согласовать с уже существующим различением депривационализма.", "draft": "Функциональная зависимость удовлетворения от нужды, количественный баланс переживаний и нормативная допустимость компенсации — разные тезисы. Даже положительный агрегированный баланс не доказывает допустимости первоначального навязывания риска.", "source_file": "concordantia.json"}, {"id": "SUP:A09", "module": "concordantia", "title": "CON:A09", "address": "Глава 26, PDF 218; приложение A", "text": "Не вводить повторную критику агрегирования.", "draft": "Необратимость состоявшегося вреда не исключает помощи и компенсации существующему субъекту. Вопрос о допустимости первоначального действия требует самостоятельного обоснования, особенно когда вред и благо относятся к разным субъектам.", "source_file": "concordantia.json"}, {"id": "SUP:E06", "module": "concordantia", "title": "CON:E06", "address": "Главы 3–4 и 9, PDF 59–60, 116", "text": "Краткая терминологическая отсылка.", "draft": "Объяснительное замыкание относительно поставленного вопроса не означает исчерпывающего объяснения всех уровней реальности. Условия достаточности задаются экспланандумом, данными, механизмом и границами модели.", "source_file": "concordantia.json"}, {"id": "LAC-S01", "module": "lacunae", "title": "Первичный факт", "address": "§7.4, PDF 98; §10.7, PDF 120; глава 24", "text": "Терминологическая ссылка, не новая глава", "draft": "В исторической методологии эфилизма предельное номологическое основание обсуждалось как Первичный факт (Fact Prime). Его единственность и конкретная физическая реализация остаются открытыми вопросами. Первичная Ошибка, напротив, обозначает оценочную квалификацию причинной архитектуры относительно переживаемого вреда.", "source_file": "lacunae.json"}, {"id": "LAC-S02", "module": "lacunae", "title": "Устойчивость факта и ценности", "address": "Главы 21 и 23, PDF 185, 193", "text": "Уточнение при необходимости", "draft": "Объективность состоявшегося переживания необходимо отличать от неизменности его интенсивности и от межсубъектной количественной соизмеримости. Различие переживаний не превращает факты о них в произвольные оценки наблюдателя.", "source_file": "lacunae.json"}, {"id": "LAC-S03", "module": "lacunae", "title": "Нулевая сумма", "address": "Глава 26, PDF 215–219; §33.5.4, PDF 278", "text": "Уточнить употребление метафоры", "draft": "Структурная зависимость удовлетворения от созданной нужды, количественное равенство благ и вреда и нормативная допустимость компенсации — разные тезисы. Вывод о недостаточности кругового оправдания создания не требует доказательства буквального нулевого баланса всех переживаний.", "source_file": "lacunae.json"}, {"id": "LAC-S04", "module": "lacunae", "title": "Замкнутое понятие", "address": "§4.2–4.3, PDF 62", "text": "Не дублировать определение; уточнить границы примеров", "draft": "Замыкание объяснительного контура оценивается относительно конкретного экспланандума, уровня описания и проверенных условий. Объяснение механизма регуляции потребности не является само по себе доказательством всей аксиологической или нормативной конструкции.", "source_file": "lacunae.json"}, {"id": "LAC-S05", "module": "lacunae", "title": "Нормативный мост", "address": "§30.6.1, PDF 243–244; §32.4.2, PDF 261", "text": "Не добавлять повторное определение; усилить независимое обоснование", "draft": "Первоначальное практическое основание и категорическое ограничение в отношении чистого создания имеют разную нормативную силу. Доказательство второго требует самостоятельной аргументации, даже когда первое уже принято.", "source_file": "lacunae.json"}, {"id": "LAC-S06", "module": "lacunae", "title": "Область абсолютности", "address": "§33.4.3–4, PDF 273–274; §33.5.4, PDF 278", "text": "Авторская развилка, не готовая правка", "draft": "Отдельно обозначить универсальность критерия, охват эмпирического условия и статус итогового этического заключения. Если термин «абсолютный» выражает безусловный запрет, требуется самостоятельное обоснование этого более сильного тезиса. Не считать отсутствие применимости конкретного правила автоматическим разрешением.", "source_file": "lacunae.json"}, {"id": "LAC-S07", "module": "lacunae", "title": "Риски страдания и экзистенциальные риски", "address": "Глава 46, PDF 378; справочный аппарат, PDF 510", "text": "Краткая справочная дефиниция после уточнения источника", "draft": "Различать риск масштабного страдания и экзистенциальный риск: категории могут пересекаться, но не тождественны. Оценка последствий для существующих субъектов, их безопасности и автономии необходима независимо от классификации риска.", "source_file": "lacunae.json"}, {"id": "HER:01", "module": "hermeneutica", "title": "Анализандум", "address": [59, 60, 68], "text": "Оставить определение; при первом употреблении указать специальный смысл, не заменять академическую терминологию.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:02", "module": "hermeneutica", "title": "Экспланандум / эксплананс", "address": [59, 60, 244], "text": "Сохранить историческую формулировку в цитировании; различить объясняющий аппарат, проект решения и нормативную оценку.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:03", "module": "hermeneutica", "title": "Замкнутое понятие", "address": [39, 60, 68, 502], "text": "Ввести различие локально замкнутой модели и глобальной претензии на полноту.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:04", "module": "hermeneutica", "title": "Первичный факт", "address": [98, 120], "text": "Добавить короткую историческую справку, не представлять гипотезу как решённую и не смешивать с Error Prime.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:05", "module": "hermeneutica", "title": "Первичная Ошибка", "address": [195, 198, 199, 200, 502], "text": "Сохранить историческую широкую формулировку в генеалогии; современное определение не выдавать за буквальный перевод.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:06", "module": "hermeneutica", "title": "Феноменология и эпистемология", "address": [183, 185, 187], "text": "Оставить разграничение; не превращать фактичность переживания в непогрешимость отчёта.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:07", "module": "hermeneutica", "title": "Ноцицепция / отрицательная эмоциональная окраска", "address": [176, 187, 193, 205], "text": "Не объединять ноцицепцию и отрицательную окраску в одном определении; отметить историческое сближение как исправленное.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:08", "module": "hermeneutica", "title": "Тождество, различие и устойчивость ценности", "address": [193, 198], "text": "Добавить краткое терминологическое примечание; не дублировать основную аргументацию.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:09", "module": "hermeneutica", "title": "Феноменальная прозрачность", "address": [177, 185], "text": "Дать атрибуцию концепции Метцингеру; точный источник фрагментов 77–99 требует текстовой сверки.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:10", "module": "hermeneutica", "title": "Долг и предписание рациональности", "address": [227, 229, 238, 243, 244], "text": "Сохранить две исходные формулы, пояснить их разные функции как современную реконструкцию, а не буквальную дефиницию.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:11", "module": "hermeneutica", "title": "Апелляция к естественности / разрыв между фактом и должным", "address": [238, 444, 450], "text": "Использовать три термина раздельно. Обращение аргумента к натализму не является позитивным обоснованием собственной нормы.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:12", "module": "hermeneutica", "title": "Двойной предохранитель", "address": [258, 261, 450], "text": "Ограничить употребление аргумента контекстом добровольного несоздания; не переносить его на обращение с существующими субъектами. ", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:13", "module": "hermeneutica", "title": "Нигилистическая контраргументация", "address": [205, 258, 502], "text": "Сохранить как отдельную отрицательную линию аргумента, не считать её положительным доказательством нормы.", "draft": "", "source_file": "hermeneutica.json"}, {"id": "HER:14", "module": "hermeneutica", "title": "Эфилизм / абсолютный антинатализм", "address": [273, 502], "text": "Сохранить принятую в проекте формулу «Эфилизм — философия абсолютного антинатализма» и отдельно зафиксировать исторически более широкую самохарактеристику. Не приписывать это тождество FAQ. ", "draft": "", "source_file": "hermeneutica.json"}, {"id": "PROF:01", "module": "profunditas", "title": "Первичный факт", "address": [120], "text": "Глава 10, PDF 120: существующее различение логической и онтологической необходимости дополнить вопросом Fact Prime и различием фундаментальности и временного начала. Сопоставить с главами 7–8 и 24; проверить весь текст перед вставкой.", "draft": "", "source_file": "profunditas.json"}, {"id": "PROF:02", "module": "profunditas", "title": "Тождество, различие и устойчивость ценности", "address": [183, 184, 193, 197], "text": "Главы 21 и 23 уже содержат пример различных реакций и реляционную объективность (PDF 184, 193). Предлагается лишь короткое уточнение термина static: устойчивость факта, а не постоянство состояния. Связать с нормативной лестницей PDF 197.", "draft": "", "source_file": "profunditas.json"}, {"id": "PROF:03", "module": "profunditas", "title": "Ценность и авторизация", "address": [250, 256, 261], "text": "PDF 250, 256, 261 уже рассматривают согласие и достаточное основание. Добавить самостоятельный термин «ценность не равна авторизации» как перекрёстную ссылку, а не новый повторный аргумент.", "draft": "", "source_file": "profunditas.json"}, {"id": "PROF:04", "module": "profunditas", "title": "Невозможность утилитарного оправдания", "address": [242, 261, 269], "text": "PDF 242, 261 и 269: уточнить, что запрет обмена выводится из защитного принципа, а не из физической необратимости вреда. Сохранить отдельность аргумента о созданных потребностях.", "draft": "", "source_file": "profunditas.json"}, {"id": "PROF:05", "module": "profunditas", "title": "Замкнутое понятие", "address": [49, 58, 59, 60, 68, 69], "text": "Главы 3–4 уже обсуждают объяснительный остаток, механизм и недоопределённость (PDF 58–60, 68–69). Рекомендуется добавить короткий проверочный протокол замкнутости с указанием области применимости.", "draft": "", "source_file": "profunditas.json"}, {"id": "PROF:06", "module": "profunditas", "title": "Нигилистическая контраргументация", "address": [196, 205, 207, 208], "text": "PDF 196 и 205–208 уже разграничивают телеологический и аксиологический нигилизм. Дополнить лишь явным различением отрицания объективного запрета и доказательства объективной разрешённости.", "draft": "", "source_file": "profunditas.json"}, {"id": "J01", "module": "justificatio", "title": "Justificatio Axiologica — объективная антиценность", "address": [185, 193, 205], "text": "В §23.2 добавить различение инвариантности феноменального аспекта и метаэтической интерпретации. Не дублировать определение реляционной объективности.", "draft": "", "source_file": "justificatio.json"}, {"id": "J02", "module": "justificatio", "title": "Justificatio Normativa — первоначальный вес вреда", "address": [193, 243, 244, 261], "text": "В §30.6.1 после первой ступени поместить аргумент симметрии как самостоятельную защиту равного учёта, с явным статусом нормативной посылки.", "draft": "", "source_file": "justificatio.json"}, {"id": "J03", "module": "justificatio", "title": "Justificatio Rationalis — долг рациональности", "address": [243, 244], "text": "В §30.6.1 разделить дефект оправдания и этическую обязанность. Сохранить различие долга и предписания рациональности.", "draft": "", "source_file": "justificatio.json"}, {"id": "J04", "module": "justificatio", "title": "Justificatio Liminaris — защитный порог", "address": [243, 244, 261, 273, 278], "text": "В §32.4.2 перед посылкой 3 дать самостоятельный аргумент от различия оправданий и явно отделить его более сильное заключение.", "draft": "", "source_file": "justificatio.json"}, {"id": "J05", "module": "justificatio", "title": "Justificatio Universalis — абсолютность и универсальность", "address": [261, 273, 274, 278], "text": "В §33.5.4 добавить явное различение универсальности стандарта и полноты эмпирического охвата; согласовать с §32.4.2 без новой полемики.", "draft": "", "source_file": "justificatio.json"}, {"id": "ME01", "module": "metaethica", "title": "Realismus — уровни объективности", "address": [193, 194, 195], "text": "В §23.2 после примеров токсичности и ключа добавить четыре смысла объективности. Утверждение об этическом реализме защищать отдельно.", "draft": "", "source_file": "metaethica.json"}, {"id": "ME02", "module": "metaethica", "title": "Naturalismus — тождество, реализация и зависимость", "address": [193, 195, 205], "text": "В §23.2 сохранить реляционность; в §30.6.1 отдельно указать, что натуралистическое тождество и нормативный мост — разные задачи.", "draft": "", "source_file": "metaethica.json"}, {"id": "ME03", "module": "metaethica", "title": "Fundamentum — основание нормативных истин", "address": [243, 244, 261], "text": "В §30.6.1 уточнить статус двух переходов: первоначальный вес и приоритет защитного ограничения. В §32.4.2 не повторять саму посылку, а обсуждать основания её выбора.", "draft": "", "source_file": "metaethica.json"}, {"id": "ME04", "module": "metaethica", "title": "Epistemologia Moralis — познаваемость и эволюционная критика", "address": [193, 194, 227, 244], "text": "Связать §28.1 с §23.2 и §30.6.1; добавить краткий симметричный протокол проверки убеждений вместо новой главы.", "draft": "", "source_file": "metaethica.json"}, {"id": "ME05", "module": "metaethica", "title": "Synthesis Metaethica — рабочая метаэтическая идентичность", "address": [193, 205, 244, 261, 278], "text": "Добавить в сравнительный раздел §33.5 краткую метаэтическую классификацию со статусом программы. Не менять определение абсолютного антинатализма и не выводить из классификации полномочия на принуждение.", "draft": "", "source_file": "metaethica.json"}, {"id": "OV27-01", "module": "valororum", "title": "Natura Valororum — природа ценностных свойств", "address": [193, 194, 211, 213, 215], "text": "§23.2: после примера терпения боли уточнить локальный и инструментальный уровни; в §26.1–26.3 не дублировать уже присутствующий отказ от тотальной редукции удовольствия к дефициту.", "draft": "", "source_file": "valororum.json"}, {"id": "OV27-02", "module": "valororum", "title": "Identitas Valororum — тождество и устойчивость", "address": [185, 193, 194, 195], "text": "§21 и §23.2: уточнить, что устойчивость относится к истинности утверждения об историческом эпизоде, а не к неизменности текущего переживания или его численной интенсивности.", "draft": "", "source_file": "valororum.json"}, {"id": "OV27-03", "module": "valororum", "title": "Verificatio — установление ценностных фактов", "address": [185, 193, 194, 205, 250], "text": "§21 и §23: добавить краткое различие феноменальной фактичности и надёжности свидетельств. Сохранять уважение к самооценке существующего субъекта; не считать его положительную оценку жизни автоматически ошибочной.", "draft": "", "source_file": "valororum.json"}, {"id": "OV27-04", "module": "valororum", "title": "Commensurabilitas — соизмеримость и агрегирование", "address": [217, 218, 219, 220, 261], "text": "§26.5 (PDF 218): добавить короткий пример 2b−a после критики количественной калькуляции. В §27 сохранить уже имеющееся разграничение восстановления и неотменимости прошлого.", "draft": "", "source_file": "valororum.json"}, {"id": "OV27-05", "module": "valororum", "title": "Asymmetria Fundamentalis — семейство асимметрий", "address": [211, 213, 238, 250, 251, 254, 261, 278], "text": "§30.6.1 и §32.4.2: дать краткую таблицу D/A/R/T, чтобы не использовать асимметрию отсутствия лишения как неявную замену антижертвенной посылки. В §33 согласовать универсальность критерия с доказанной областью его применения.", "draft": "", "source_file": "valororum.json"}, {"id": "EP28-01", "module": "epistemologia", "title": "Veritas Objectiva — истина и статус знания", "address": [32, 33, 35, 42, 45], "text": "§1.2, §2.4: уточнить область самоприменения. В §23.2 связать объективность феноменального факта с отдельной аксиологической посылкой; не подменять её корреспондентной истиной.", "draft": "", "source_file": "epistemologia.json"}, {"id": "EP28-02", "module": "epistemologia", "title": "Clausura Conceptualis — локальная достаточность", "address": [38, 58, 59, 60, 62, 68, 71], "text": "§4.10 и §4.13: добавить пример равных правдоподобий, где новое наблюдение не различает две модели. Сохранить существующий восьмишаговый аудит.", "draft": "", "source_file": "epistemologia.json"}, {"id": "EP28-03", "module": "epistemologia", "title": "Metacognitio — калибровка уверенности", "address": [35, 50, 51], "text": "§3.3: предложить калибровку на простых прогнозах и раздельную оценку качества аргументации. Психологическое объяснение убеждения проверять одинаково для собственной и конкурирующих позиций.", "draft": "", "source_file": "epistemologia.json"}, {"id": "EP28-04", "module": "epistemologia", "title": "Metarationalitas — проверка критериев", "address": [50, 64, 69, 70, 72, 243], "text": "§4.6 и §30.6.1: ввести различие аудита применения нормы и аудита её обоснования. Не выводить категорическую обязанность из определения рациональности.", "draft": "", "source_file": "epistemologia.json"}, {"id": "EP28-05", "module": "epistemologia", "title": "Methodologia Errorum — прикладной аудит", "address": [59, 60, 66, 68, 69, 71, 72, 73], "text": "§4.13: добавить пример заполненного журнала и симметричный аудит собственной аргументации. Не применять оценку теории к достоинству или автономии существующих субъектов.", "draft": "", "source_file": "epistemologia.json"}, {"id": "MP29-01", "module": "metaphysica", "title": "Realitas Fundamentalis — натуралистический физикализм", "address": [106, 107, 108, 115], "text": "§9.1, §9.9: добавить явное различие между методологическим натурализмом и метафизическим физикализмом; не объявлять любой проверяемый факт по определению физическим.", "draft": "", "source_file": "metaphysica.json"}, {"id": "MP29-02", "module": "metaphysica", "title": "Necessitas Nomologica — необходимость и законы", "address": [97, 98, 100, 120], "text": "§7.4: добавить контрпример с двумя мирами и разными законами. Не приписывать закону функцию намеренного управления.", "draft": "", "source_file": "metaphysica.json"}, {"id": "MP29-03", "module": "metaphysica", "title": "Factum Primum — Первичный факт", "address": [116, 117, 118, 119, 120], "text": "§10.5–10.6: дать ссылку на Fact Prime как историческую постановку вопроса; не смешивать его с Первичной Ошибкой и не выводить невозможность бесконечного прошлого.", "draft": "", "source_file": "metaphysica.json"}, {"id": "MP29-04", "module": "metaphysica", "title": "Chaos Deterministicum — порядок без замысла", "address": [98, 99, 100, 123, 132, 134, 135], "text": "§7.6–7.7: добавить численный пример чувствительности; §11.4: не превращать интерпретацию квантовой механики в доказанный факт.", "draft": "", "source_file": "metaphysica.json"}, {"id": "MP29-05", "module": "metaphysica", "title": "Error Primus — Первичная Ошибка", "address": [198, 199, 200, 202], "text": "§24.1–24.4: сохранить действующее определение; добавить короткую ссылку на различие Fact Prime и Error Prime. Не выводить этический запрет исключительно из космологии.", "draft": "", "source_file": "metaphysica.json"}, {"id": "MP29-06", "module": "metaphysica", "title": "Hierarchia Nomologica — уровни и причинная информация", "address": [101, 102, 103, 104, 105, 202], "text": "§8.2–8.6: добавить конечный пример двух микросостояний одного макрокласса с одинаковыми и различными последующими макросостояниями; §24.5: маркировать типы стрелок, не универсализировать конкретный путь возникновения опыта.", "draft": "", "source_file": "metaphysica.json"}, {"id": "PH30-01", "module": "phenomenologia", "title": "Sentientia — сентиентность", "address": [167, 173, 175, 181, 182], "text": "Сохранить лестницу как дидактическую последовательность различений; уточнить, что она не является универсальной шкалой организмов и не задаёт необходимые ступени развития.", "draft": "", "source_file": "phenomenologia.json"}, {"id": "PH30-02", "module": "phenomenologia", "title": "Realizatio Physica — физическая реализация", "address": [168, 181, 186], "text": "В §20.6 добавить краткое сопоставление GNWT/IIT/HOT/рекуррентных подходов и исследование Cogitate 2025; не объявлять победителя.", "draft": "", "source_file": "phenomenologia.json"}, {"id": "PH30-03", "module": "phenomenologia", "title": "Transparentia — прозрачность", "address": [177, 178, 179, 180, 185], "text": "Сохранить разграничение в §21.2.1. В §20.5.1 заменить претензию на исчерпывающий ответ более точным указанием на объяснение конкретной эквивокации.", "draft": "", "source_file": "phenomenologia.json"}, {"id": "PH30-04", "module": "phenomenologia", "title": "Architectura Affectiva — эмоциональная окраска", "address": [188, 189, 190, 191, 173], "text": "Согласовать PDF 191 с разграничениями депривационализма в главе 26; не отрицать положительный опыт и сохранять независимость аргумента локальной антиценности.", "draft": "", "source_file": "phenomenologia.json"}, {"id": "PH30-05", "module": "phenomenologia", "title": "Identitas Subjecti — тождество субъекта", "address": [175, 177, 186], "text": "На PDF 177 уточнить: качественно сходный тип уязвимости, а не численно один и тот же субъект. Не выводить переселение или всеобщую субъективность из сходства.", "draft": "", "source_file": "phenomenologia.json"}, {"id": "PH30-06", "module": "phenomenologia", "title": "Nexus Axiologicus — феноменология и ценность", "address": [179, 184, 185, 187, 190, 193], "text": "В §20.5 уточнить область модели; в §21.2 отделить факт опыта от безошибочности его классификации и интенсивности. Сохранять этику помощи, автономию и добровольность.", "draft": "", "source_file": "phenomenologia.json"}, {"id": "BIO31-01", "module": "biologia", "title": "Abiogenesis — абиогенез", "address": [141, 144, 145, 146], "text": "Сохранить §14.8. В §14.7 представить конкретные среды и этапы РНК→ДНК как реконструкции, а не единственную установленную хронологию. Не выводить вероятность абиогенеза из одного известного случая.", "draft": "", "source_file": "biologia.json"}, {"id": "BIO31-02", "module": "biologia", "title": "Replicatio — репликационное заблуждение", "address": [147, 148, 150, 151], "text": "Сохранить три смысла успеха в начале главы 16. В §15.3 заменить метафору пассивного склада на контекстно-зависимую причинную роль генома; в главе 16 явно исключить генетическую ошибку аргументации.", "draft": "", "source_file": "biologia.json"}, {"id": "BIO31-03", "module": "biologia", "title": "Selectio Naturalis — естественный отбор", "address": [151, 152, 156], "text": "Добавить в главу 16 короткую вставку об уравнении Прайса. Не говорить о максимизации глобального благополучия или обязательном его уменьшении. Различать ожидаемую приспособленность и фактический вклад.", "draft": "", "source_file": "biologia.json"}, {"id": "BIO31-04", "module": "biologia", "title": "Architectura Indigentiae — архитектура нужды", "address": [162, 163, 164, 165], "text": "В §18.2.1 ограничить двухзубую вилку моделями повторяющихся потребностей; §18.4 не противопоставлять гомеостаз и аллостаз как универсальную реактивность и универсальную предиктивность. Сохранить различие с переживаемым вредом.", "draft": "", "source_file": "biologia.json"}, {"id": "BIO31-05", "module": "biologia", "title": "Conflictus Biologicus — биологические конфликты", "address": [150, 155, 166], "text": "В §18.7 сохранить оба класса взаимодействий; заменить универсализацию репродуктивной выгоды конкретными механизмами, где это подтверждается данными.", "draft": "", "source_file": "biologia.json"}, {"id": "BIO31-06", "module": "biologia", "title": "Dysfunctio Primaria — первичная дисфункция", "address": [155, 157, 160, 198, 199, 202], "text": "На PDF 155 согласовать сильную фразу о дисфункции с главами 17 и 24: уточнить, что речь о специальном оценочном смысле, а не об отсутствии биологической функции.", "draft": "", "source_file": "biologia.json"}, {"id": "BIO31-07", "module": "biologia", "title": "Nexus Bioethicus — биология и этические основания", "address": [141, 160, 167, 170, 198, 199], "text": "Сохранить демаркации §19.5 и связать с §30.6.1. Обозначить условность защитного вывода, не подменять этику помощи оценкой происхождения жизни.", "draft": "", "source_file": "biologia.json"}, {"id": "PSY32-01", "module": "psychologia", "title": "Bias Cognitivus — когнитивные смещения", "address": [282, 283, 286, 287], "text": "§34.3.3: Симметрия проверки означает одинаковый критерий для однотипных эмпирических утверждений. Различие нормативных обязательств сторон требует отдельного обоснования; одинаковый критерий не подразумевает одинаковое бремя доказательства.", "draft": "", "source_file": "psychologia.json"}, {"id": "PSY32-02", "module": "psychologia", "title": "Rationalisatio — рационализация и конфабуляция", "address": [282, 287], "text": "§34.3.4: Конфабуляция в специальном смысле относится к ошибочной реконструкции памяти без намерения обмануть; постфактум объяснение выбора и мотивированная рационализация — смежные, но не тождественные процессы. Реконструкция памяти не обязательно сглаживает неприятный опыт.", "draft": "", "source_file": "psychologia.json"}, {"id": "PSY32-03", "module": "psychologia", "title": "Normalisatio — гипернормализация", "address": [289, 290], "text": "§34.4: Гипернормализация — специальное понятие для сдвига стандарта приемлемости при повторении неблагоприятных событий. Снижение заметности не равнозначно снижению переживаемого вреда, хотя адаптация может менять сам опыт. Не отождествлять с термином Вон.", "draft": "", "source_file": "psychologia.json"}, {"id": "PSY32-04", "module": "psychologia", "title": "Optimismus — оптимизм и негативное смещение", "address": [285, 286, 287, 293], "text": "§34.3: Обвинение в негативном смещении обоснованно лишь при выявлении необоснованного завышения вероятности или тяжести отрицательных исходов либо избирательной обработки данных. Нормативный приоритет предотвращения вреда обсуждается отдельно. Оптимистическое смещение проверяется по тому же стандарту.", "draft": "", "source_file": "psychologia.json"}, {"id": "PSY32-05", "module": "psychologia", "title": "Parochialismus — избирательность оценок", "address": [239, 289, 294, 295], "text": "§35.1: Добавить Neal & Watling Neal 2022 и повтор 2023 как ограниченное свидетельство межгруппового предпочтения. В §30.1 указать: ограниченная сфера помощи сама по себе не является парохиальной ошибкой.", "draft": "", "source_file": "psychologia.json"}, {"id": "PSY32-06", "module": "psychologia", "title": "Defensio Psychologica — психологическая защита", "address": [282, 288, 289, 291, 293], "text": "PDF 293: Вместо категорического «срабатывает защитный перенос» — «в отдельных случаях защитное реагирование может объяснять перенос раздражения на собеседника; для установления этой причины нужны независимые свидетельства». Сохранить оговорку о воспроизводимости.", "draft": "", "source_file": "psychologia.json"}, {"id": "PSY32-07", "module": "psychologia", "title": "Correctio Metacognitiva — метапознавательная коррекция", "address": [50, 51, 282, 287, 290, 291], "text": "§3.3 и §34.4: добавить перекрёстную ссылку на протокол Epistemologia, а также тест смены групповой метки. Для нормативного тезиса записывать отдельно спорные посылки, не назначать им мнимые эмпирические вероятности.", "draft": "", "source_file": "psychologia.json"}, {"id": "E01", "module": "ethica", "title": "Ethica Praeventionis — этика профилактики", "address": [234, 235, 446], "text": "К §29.2: профилактика оценивается не только по отсутствию будущего экземпляра проблемы, но и по последствиям самой меры для существующих субъектов; коррекция и профилактика могут быть совместными задачами.", "draft": "К §29.2: профилактика оценивается не только по отсутствию будущего экземпляра проблемы, но и по последствиям самой меры для существующих субъектов; коррекция и профилактика могут быть совместными задачами.", "source_file": "ethica.json"}, {"id": "E02", "module": "ethica", "title": "Ethica Correctionis — этика коррекции", "address": [238, 250, 446], "text": "К §30.1: профилактическая оценка возникновения риска не пересматривает равную значимость уже существующих субъектов. Их защита, помощь и уважение автономии остаются самостоятельными задачами.", "draft": "К §30.1: профилактическая оценка возникновения риска не пересматривает равную значимость уже существующих субъектов. Их защита, помощь и уважение автономии остаются самостоятельными задачами.", "source_file": "ethica.json"}, {"id": "E03", "module": "ethica", "title": "Consensus — согласие и полномочия", "address": [250, 443, 450], "text": "К §31.3: временная невозможность согласия устанавливает отсутствие именно предварительной авторизации; достаточность иных оснований — отдельный нормативный вопрос.", "draft": "К §31.3: временная невозможность согласия устанавливает отсутствие именно предварительной авторизации; достаточность иных оснований — отдельный нормативный вопрос.", "source_file": "ethica.json"}, {"id": "E04", "module": "ethica", "title": "Impositio — навязывание риска", "address": [261, 270, 444], "text": "К §33.3.4: разделить причинное объяснение, оценку фактически переживаемого вреда, сравнительное ухудшение и нормативное нарушение; каждое требует собственного критерия.", "draft": "К §33.3.4: разделить причинное объяснение, оценку фактически переживаемого вреда, сравнительное ухудшение и нормативное нарушение; каждое требует собственного критерия.", "source_file": "ethica.json"}, {"id": "E05", "module": "ethica", "title": "Noninstrumentalisatio — недопустимость инструментализации", "address": [238, 261, 269], "text": "К §33.3.1: общественная ценность результата не отменяет необходимости самостоятельного оправдания бремени, приходящегося на каждого затрагиваемого субъекта. Взаимовыгодное сотрудничество не следует отождествлять с инструментализацией.", "draft": "К §33.3.1: общественная ценность результата не отменяет необходимости самостоятельного оправдания бремени, приходящегося на каждого затрагиваемого субъекта. Взаимовыгодное сотрудничество не следует отождествлять с инструментализацией.", "source_file": "ethica.json"}, {"id": "E06", "module": "ethica", "title": "Onus Probandi — бремя доказательства", "address": [255, 256, 258, 443, 451], "text": "К §32.3: специальное практическое бремя инициатора не снимает общего эпистемического бремени с автора запрещающего принципа. Бремя оправдания воздержания возникает там, где оно само затрагивает защищаемый интерес.", "draft": "К §32.3: специальное практическое бремя инициатора не снимает общего эпистемического бремени с автора запрещающего принципа. Бремя оправдания воздержания возникает там, где оно само затрагивает защищаемый интерес.", "source_file": "ethica.json"}, {"id": "E07", "module": "ethica", "title": "Cohaerentia Normativa — согласованность принципов", "address": [238, 261, 273, 274, 450, 451], "text": "К приложению A: перед применением правил установить область каждого, затем проверить совместимость требований. Конфликт фиксировать как отдельный результат, требующий аргументации, а не как автоматически разрешённый.", "draft": "К приложению A: перед применением правил установить область каждого, затем проверить совместимость требований. Конфликт фиксировать как отдельный результат, требующий аргументации, а не как автоматически разрешённый.", "source_file": "ethica.json"}], "metrics": {"recommendations": 95, "clusters": 24, "priority": {"P1": 8, "P2": 14, "P3": 2}, "concepts": 137, "principles": 9, "arguments": 18, "direct_dependencies": 16, "transitive_dependencies": 22}, "limits": ["Кластеризация редакторская; некоторые записи содержат несколько предложений, назначен один основной кластер.", "Сокращение числа задач не означает устранения всех смысловых различий; исходные записи сохранены.", "Оценки охвата унаследованы из Lacunae, не повторная независимая экспертиза.", "Принципы кандидатные, граф зависимостей наследует редакторскую реконструкцию и не является доказательством.", "Новых академических источников не проверялось; монография не редактировалась."]}</script><script>
const d=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='clusters',visible=[];const names={clusters:'План правок',strata:'Архитектура',concepts:'137 концепций',principles:'9 принципов',arguments:'18 аргументов',source_recommendations:'Исходные записи'};const source=Object.fromEntries(d.source_recommendations.map(x=>[x.id,x]));$('metrics').innerHTML=[['Исходные записи',d.metrics.recommendations],['Задачи',d.metrics.clusters],['Концепции',d.metrics.concepts],['Аргументы',d.metrics.arguments]].map(([t,v])=>`<div class="metric"><b>${v}</b>${t}</div>`).join('');$('tabs').innerHTML=Object.entries(names).map(([k,v])=>`<button data-tab="${k}" aria-pressed="${k===tab}">${v}</button>`).join('');function row(x){let title=x.title||x.id;let s='';if(tab==='clusters'){s=`<p><b>Адрес:</b> ${esc(x.address)} · ${esc(x.decision)}</p><p>${esc(x.plan)}</p><p><b>Приёмка:</b> ${esc(x.acceptance)}</p>`+x.source_ids.map(id=>`<details><summary>${esc(id)} · ${esc(source[id].title)}</summary><p>${esc(source[id].text)}</p><small>${esc(source[id].source_file)} · ${esc(source[id].address)}</small></details>`).join('')}else if(tab==='concepts'){s=`<p>${esc(x.definition)}</p><p>${esc(x.note)}</p><small>${esc(x.status_label)} · PDF ${esc(x.pages)} · ${esc(x.historical_anchors)}</small>`}else if(tab==='arguments'){s=`<p>${esc(x.conclusion)}</p><p>Прямые: ${esc(x.direct.join(', ')||'нет')} · Транзитивные: ${esc(x.transitive.join(', ')||'нет')}</p><p>${esc(x.remaining)}</p><small>${esc(x.status)} · ${esc(x.limit)}</small>`}else if(tab==='principles'){s=`<p>${esc(x.body)}</p><small>${esc(x.antecedents.join(' + '))} → ${esc(x.conclusion)}</small>`}else if(tab==='strata'){s=`<p>${esc(x.items.join(' · '))}</p><small>${esc(x.status)}</small>`}else{s=`<p>${esc(x.text)}</p><small>${esc(x.source_file)} · ${esc(x.address)}</small>`}return `<article><details ${tab==='strata'?'open':''}><summary>${x.priority?'<span class="chip">'+esc(x.priority)+'</span>':''}${esc(x.id||'')} ${esc(title)}</summary>${s}</details></article>`}function render(){const q=$('q').value.toLowerCase().trim(),f=$('filter').value; $('filter').disabled=tab!=='clusters';visible=d[tab].filter(x=>(tab!=='clusters'||!f||x.priority===f)&&JSON.stringify(x).toLowerCase().includes(q));$('results').innerHTML=visible.map(row).join('')||'<p>Нет совпадений.</p>';$('count').textContent=visible.length+' из '+d[tab].length;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab))} $('tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;$('q').value='';$('filter').value='';render()}};$('q').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({version:d.version,tab,records:visible},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='systematica_selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('limits').innerHTML='<h2>Ограничения</h2>'+d.limits.map(x=>'<p>'+esc(x)+'</p>').join('');render();</script></body></html>
