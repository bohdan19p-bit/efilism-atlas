conditional", "review_pages": [195, 198, 199, 200, 502], "review_note": "Глава 24 определяет Первичную Ошибку как сентиоцентрический диагноз, а не физическую поломку.", "proof_boundary": "Не отождествлять безличность законов с ошибкой без названного критерия."}, {"id": "CON:ARG-16", "argument_id": "ARG-16", "title": "Квазипозитивность как сильный эмпирический тезис", "prior_status": "partial", "pdf_pages": [211, 215, 217, 218, 219], "text_available_pages": [211, 215, 217, 218, 219], "conclusion": "Компенсаторный механизм поддерживает ограниченный тезис о части благ; универсальная квазипозитивность остаётся исследуемой гипотезой.", "previous_result": "Различены версии депривационализма и признана реальность положительного опыта.", "remaining_obligation": "Нужна независимая проверка универсальности; нейронаучное различение liking/wanting само по себе не опровергает все версии тезиса.", "note": "Проверена доступность текста всех указанных страниц; содержательная оценка наследуется из Integratio, не новая независимая проверка валидности.", "review_status": "reconstructed", "review_pages": [211, 215, 217, 218, 219], "review_note": "Глава 26 ограничивает тотальный депривационализм и различает структурную нужду и положительные переживания.", "proof_boundary": "Формальный вывод не должен зависеть от тезиса о компенсаторности всех благ."}, {"id": "CON:ARG-17", "argument_id": "ARG-17", "title": "Двойной предохранитель: два эффекта несоздания", "prior_status": "partial", "pdf_pages": [225, 248, 446], "text_available_pages": [225, 248, 446], "conclusion": "Несоздание предотвращает его возможный вред без причинения ему переживаемого лишения благ.", "previous_result": "Схема 14 определяет двойной предохранитель как коррекцию текущего вреда и предотвращение повторного производства.", "remaining_obligation": "Отдельно рассмотреть внешние последствия и конкурирующие аксиологии; никакого вывода о допустимости вреда живущим.", "note": "Проверена доступность текста всех указанных страниц; содержательная оценка наследуется из Integratio, не новая независимая проверка валидности.", "review_status": "conditional", "review_pages": [225, 248, 412, 441, 446], "review_note": "Два аспекта несоздания представлены в асимметрии; прямые адреса термина из v2.3: 412, 441.", "proof_boundary": "Не переносить отсутствие нового субъекта на интересы уже существующих."}, {"id": "CON:ARG-18", "argument_id": "ARG-18", "title": "Синтез: условное обоснование абсолютного антинатализма", "prior_status": "open", "pdf_pages": [261, 273, 274, 278, 451], "text_available_pages": [261, 273, 274, 278, 451], "conclusion": "Абсолютный антинатализм следует условно при обосновании универсального условия запрета и его применимости.", "previous_result": "Книга формализует четырёхпосылочный вывод для известных условий и семиступенчатую иерархию.", "remaining_obligation": "Проверить универсальный квантор и все исключения; учитывать автономию, добровольность и защиту существующих субъектов.", "note": "Проверена доступность текста всех указанных страниц; содержательная оценка наследуется из Integratio, не новая независимая проверка валидности.", "review_status": "open_scope", "review_pages": [261, 273, 274, 278, 451], "review_note": "§32.4.2 устанавливает условный вывод в известных условиях, §33.4.3–4 проверяет область универсальности, §33.5.4 формулирует универсальный критерий.", "proof_boundary": "Отдельно согласовать абсолютность определения и логический охват правила. Не выводить полномочия на принуждение."}], "supplements": [{"id": "LAC-S01", "address": "§7.4, PDF 98; §10.7, PDF 120; глава 24", "title": "Первичный факт", "decision": "Терминологическая ссылка, не новая глава", "draft": "В исторической методологии эфилизма предельное номологическое основание обсуждалось как Первичный факт (Fact Prime). Его единственность и конкретная физическая реализация остаются открытыми вопросами. Первичная Ошибка, напротив, обозначает оценочную квалификацию причинной архитектуры относительно переживаемого вреда.", "basis": ["CON:O07", "CON:O06", "CON:O08"]}, {"id": "LAC-S02", "address": "Главы 21 и 23, PDF 185, 193", "title": "Устойчивость факта и ценности", "decision": "Уточнение при необходимости", "draft": "Объективность состоявшегося переживания необходимо отличать от неизменности его интенсивности и от межсубъектной количественной соизмеримости. Различие переживаний не превращает факты о них в произвольные оценки наблюдателя.", "basis": ["CON:C05", "CON:C04"]}, {"id": "LAC-S03", "address": "Глава 26, PDF 215–219; §33.5.4, PDF 278", "title": "Нулевая сумма", "decision": "Уточнить употребление метафоры", "draft": "Структурная зависимость удовлетворения от созданной нужды, количественное равенство благ и вреда и нормативная допустимость компенсации — разные тезисы. Вывод о недостаточности кругового оправдания создания не требует доказательства буквального нулевого баланса всех переживаний.", "basis": ["CON:A08", "CON:A03", "CON:A09"]}, {"id": "LAC-S04", "address": "§4.2–4.3, PDF 62", "title": "Замкнутое понятие", "decision": "Не дублировать определение; уточнить границы примеров", "draft": "Замыкание объяснительного контура оценивается относительно конкретного экспланандума, уровня описания и проверенных условий. Объяснение механизма регуляции потребности не является само по себе доказательством всей аксиологической или нормативной конструкции.", "basis": ["CON:E06", "CON:L11", "CON:E05"]}, {"id": "LAC-S05", "address": "§30.6.1, PDF 243–244; §32.4.2, PDF 261", "title": "Нормативный мост", "decision": "Не добавлять повторное определение; усилить независимое обоснование", "draft": "Первоначальное практическое основание и категорическое ограничение в отношении чистого создания имеют разную нормативную силу. Доказательство второго требует самостоятельной аргументации, даже когда первое уже принято.", "basis": ["CON:X04", "CON:N03"]}, {"id": "LAC-S06", "address": "§33.4.3–4, PDF 273–274; §33.5.4, PDF 278", "title": "Область абсолютности", "decision": "Авторская развилка, не готовая правка", "draft": "Отдельно обозначить универсальность критерия, охват эмпирического условия и статус итогового этического заключения. Если термин «абсолютный» выражает безусловный запрет, требуется самостоятельное обоснование этого более сильного тезиса. Не считать отсутствие применимости конкретного правила автоматическим разрешением.", "basis": ["CON:X01"]}, {"id": "LAC-S07", "address": "Глава 46, PDF 378; справочный аппарат, PDF 510", "title": "Риски страдания и экзистенциальные риски", "decision": "Краткая справочная дефиниция после уточнения источника", "draft": "Различать риск масштабного страдания и экзистенциальный риск: категории могут пересекаться, но не тождественны. Оценка последствий для существующих субъектов, их безопасности и автономии необходима независимо от классификации риска.", "basis": ["CON:S10"]}], "limitations": ["Смысловые оценки редакторские и основаны на выбранных фрагментах; отсутствие локатора не доказывает отсутствия идеи.", "23 ранее проверенные оценки наследованы без повторного аудита.", "Использован ранее восстановленный текст PDF, а не новый OCR; ошибки символов и формул возможны.", "Сверка 18 аргументов является проверкой содержательного соответствия, не независимой проверкой всех посылок.", "Новые внешние академические источники не добавлялись; оригинал книги и семантический граф не изменены."]}</script><script>
const D=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let tab='records';const el=(t,s)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=s;return n};const add=(p,t,s)=>p.appendChild(el(t,s));for(const [k,v] of Object.entries(D.counts)){const n=el('div');n.className='stat';add(n,'b',v);add(n,'span',D.labels[k]);$('stats').append(n);const o=el('option',D.labels[k]);o.value=k;$('status').append(o)}for(const g of [...new Set(D.records.map(r=>r.group))].sort()){const o=el('option',g);o.value=g;$('group').append(o)}function render(){const is=tab==='records',q=$('q').value.toLowerCase().trim();$('status').hidden=!is;$('group').hidden=!is;let data=D[tab].filter(x=>(!is||(!$('status').value||x.status===$('status').value)&&(!$('group').value||x.group===$('group').value))&&JSON.stringify(x).toLowerCase().includes(q));$('count').textContent=`${data.length} / ${D[tab].length}`;$('list').replaceChildren();for(const x of data){if(is){let d=el('details'),s=el('summary',x.title);add(s,'span',`${x.id} · ${x.english} · ${x.status_label} · PDF ${x.pages.join(', ')}`);d.append(s);add(d,'p',x.note);add(d,'p','Каталог: '+x.definition);add(d,'p','Граница: '+x.boundary);add(d,'small','Источники Вики: '+x.historical_anchors.join(', '));add(d,'p',x.review_type==='inherited_v2.3'?'Оценка унаследована из v2.3':'Новая адресная контекстная оценка');$('list').append(d)}else{let a=el('article');add(a,'h3',x.title);if(tab==='arguments'){add(a,'small',x.argument_id+' · '+x.review_status+' · PDF '+x.review_pages.join(', '));add(a,'p',x.review_note);add(a,'p','Граница вывода: '+x.proof_boundary)}else{add(a,'small',x.address);add(a,'p',x.decision);add(a,'p',x.draft)}$('list').append(a)}}}for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));render()};for(const id of ['q','status','group'])$(id).addEventListener(id==='q'?'input':'change',render);add($('limits'),'h3','Ограничения');for(const s of D.limitations)add($('limits'),'p',s);render();</script></body></html>
