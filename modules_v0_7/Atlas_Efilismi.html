.","origin":"Определение из приложения C","where":"Приложение C; PDF 433 · печатная 432","role":"Проверочная функция указана в авторском определении.","limit":"Сопоставляйте с центральной схемой и замечаниями аудита. Само включение термина в словарь не доказывает сильные выводы с ним."}},{"id":"book:g002","label":"Корреспондентное ядро истины","layer":"monograph","category":"I. Истина, знание и метод","kind":"concept","definition":"Реалистическое и преимущественно корреспондентное понимание истины как соответствия утверждения независимому от субъекта действительному положению дел ([G01; G04]). В архитектуре книги оно объединяет шесть элементов: 1) онтологический реализм; 2) корреспондентное ядро; 3) антирелятивизм; 4) опровержение релятивизма через самоприменение; 5) модально- рационалистический слой (связь истины с возможным, невозможным и номологически необходимым); и 6) объяснительный реализм (связь истины с замкнутым причинным механизмом). Противостоит когерентизму (согласованность без соответствия миру не даёт истины), прагматизму (психологическая или эволюционная полезность убеждения не делает его истинным) и дефляционизму.","provenance":{"artifact":"Efilizm_karta_knigi.html (12.11.2026)","locator":"Приложение C; PDF 433 · печатная 432","original_id":"g002","origin":"Определение из приложения C"},"validation":"imported_unverified","role":"Проверочная функция указана в авторском определении.","limit":"Сопоставляйте с центральной схемой и замечаниями аудита. Само включение термина в словарь не доказывает сильные выводы с ним.","legacy":{"id":"g002","term":"Корреспондентное ядро истины","category":"I. Истина, знание и метод","pdf_page":433,"definition":"Реалистическое и преимущественно корреспондентное понимание истины как соответствия утверждения независимому от субъекта действительному положению дел ([G01; G04]). В архитектуре книги оно объединяет шесть элементов: 1) онтологический реализм; 2) корреспондентное ядро; 3) антирелятивизм; 4) опровержение релятивизм ком определении.","limit":"Сопоставляйте с центральной схемой и замечаниями аудита. Само включение термина в словарь не доказывает сильные выводы с ним.","legacy":{"id":"g024","term":"Замкнутое объяснительное понятие (замкнутый объяснительный контур)","category":"II. Объяснение, модальность и доказательная дисциплина","pdf_page":436,"definition":"Теоретическая модель, которая без остатка отражает строгий, замкнутый и минимально достаточный набор реальных (номологических, причинных и структурных) составляющих изучаемого явления и порождаемых ими необходимых условий. Как только такой минимально достаточный набор воспроизведён в экспланансе, явление получает полное структурное объяснение (замкнутое эмпирическое следствие), а введение любых дополнительных сущностей отсекается как избыточное.","origin":"Определение из приложения C","where":"Приложение C; PDF 436 · печатная 435","role":"Проверочная функция указана в авторском определении.","limit":"Сопоставляйте с центральной схемой и замечаниями аудита. Само включение термина в словарь не доказывает сильные выводы с ним."}},{"id":"book:g025","label":"Онтологическое (номологическое) замыкание","layer":"monograph","category":"II. Объяснение, модальность и доказательная дисциплина","kind":"concept","definition":"Фундаментальное свойство реальности состоять из строгого, конечного и минимально достаточного набора базовых структурных ограничений (номологических составляющих), из сцепления которых с необходимостью вытекают производные условия существования (подобно тому как из существования объектов, дистанции и немгновенного движения с необходимостью вытекает время). Исключает существование в природе беспричинных «джокеров», произвола и нарушений причинной связности.","provenance":{"artifact":"Efilizm_karta_knigi.html (12.11.2026)","locator":"Приложение C; PDF 436 · печатная 435","original_id":"g025","origin":"Определение из приложения C"},"validation":"imported_unverified","role":"Проверочная функция указана в авторском опред pt","definition":"Центральное нормативное, аксиологическое и практическое ядро философской системы эфилизма: позиция, распространяющая единый проверочный стандарт прокреативной этики (отсутствие предшествующего субъекта и депривации в небытии до создания — до зачатия или иного запуска сентиентности, невозможность аутентичного предварительного согласия, теорему взаимного обнуления презумпций и антижертвенный защитный порог против конститутивного риска крайнего вреда) на любых чувствующих субъектов независимо от биологического вида, эволюционного происхождения и физического субстрата (включая человека, животных дикой природы и потенциальную искусственную или внеземную сентиентность). Вокруг этого ядра эфилизм выстраивает четырёхъярусную натуралистическую систему: 1) онтолого-эволюционную диагностику слепого воспроизводства ДНК как первичной проблемной архитектуры (защищаемой в культуре мифами об исключительности и мегаломанией мифологизации ДНК); 2) нейрофеноменологическую аксиологию отрицательной валентности и прозрачности самомодели (опровергающую редукционистский «анализандум непрозрачности»); 3) метарациональный нормативный мост через двухпроходную редукцию этики от третьего лица (где проблемы и ошибки выступают экспланандумом, а их устранение — экспланансом и предписанием рациональности); и 4) ненасильственную предохранительную стратегию, в которой абсолютность запрета на создание новых жертв сочетается с нерушимой защитой автономии, паллиативной помощью и правом на выход для уже существующих субъектов (Главы 32–33).","provenance":{"artifact":"Efilizm_karta_knigi.html (12.11.2026)","locator":"Приложение C; PDF 448 · печатная 447","original_id":"g127","origin":"Определение из приложения C"},"validation":"imported_unverified","role":"Проверочная функция указана в авторском определении.","limit":"Сопоставляйте с центральной схемой и замечаниями аудита. Само включение термина в словарь не доказывает сильные выводы с ним.","legacy":{"id":"g127","term":"Абсолютный анти 1","type":"related_to","label":"Тематически связан (не вывод)","explanation":"Историческая запись смешивала связанные физиологические и феноменальные понятия; боль выделена отдельно.","note":"Новая аналитическая связь; не буквальная цитата и не доказательство.","provenance":{"artifact":"Ontologia v0.4","source_node_anchors":["OV:P0030","OV:P0031","OV:P0032","OV:P0033","OV:P0034","FAQ:P0092","FAQ:P0093","FAQ:P0094"],"target_node_anchors":["OV:P0030","OV:P0031","OV:P0089"]},"validation":"qualified_relation"}],"arguments":[{"id":"wiki:A001","validation":"source_check_pending","legacy":{"ID":"A001","Домен":"Эпистемология","Модуль аргумента":"Анти-субъективистский аргумент опыта","Вывод":"Пусть убеждения могут быть ложными; состоявшееся переживание боли не становится ложным; значит вред нельзя списать как 'просто мнение'.","Посылки/цепь":"Носитель испытывает опыт; опыт имеет отрицательную валентность; отрицательная валентность не выбирается произвольно.","Типовое возражение":"Это всё равно субъективно.","Как усилить":"Развести субъективный доступ и объективный факт события в системе.","Источник":"Objective Value","Главы книги":"Глава 7, 22"}},{"id":"wiki:A002","validation":"source_check_pending","legacy":{"ID":"A002","Домен":"Эпистемология","Модуль аргумента":"Аргумент бремени доказательства","Вывод":"Критика эфилизма не доказывает натализм; натализму нужно самостоятельное оправдание.","Посылки/цепь":"Натализм активирует риск; отказ не создаёт жертву; активатор риска несёт нагрузку.","Типовое возражение":"Эфилизм тоже должен доказать всё абсолютно.","Как усилить":"Показать, что невоспроизводство не запускает вред, а воспроизводство запускает.","Источник":"Objective Truth","Главы книги":"Глава 28, 30"}},{"id":"wiki:A003","validation":"source_check_pending","legacy":{"ID":"A003","Домен":"Метафизика","Модуль аргумента":"Аргумент против метафизической страховки","Вывод":"Нет доказанного плана, души, компенсации или космического предохранителя; значит нельзя оправдывать риск ссылкой на скрытый смысл.","Посылки/цепь":"Атеология; материализм; отсутствие гарантии компенсации.","Типовое возражение":"Может быть, смысл скрыт.","Как усилить":"Скрытая возможность не даёт права навязывать реальный риск.","Источник":"Objective Truth; Philosophy Arena","Главы книги":"Глава 11, 12"}},{"id":"wiki:A004","validation":"source_check_pending","legacy":{"ID":"A004","Домен":"Метафизика","Модуль аргумента":"Детерминизм без фатализма","Вывод":"Детерминированность процессов не означает, что изменение невозможно; она означает, что изменение тоже причинно обусловлено.","Посылки/цепь":"Контингентные формы изменяемы; последствия зависят от причинных цепей.","Типовое возражение":"Если всё детерминировано, ничего нельзя изменить.","Как усилить":"Развести статическую необходимость и изменяемую контингентность.","Источник":"Philosophy Arena; Objective Truth","Главы книги":"Глава 15"}},{"id":"wiki:A005","validation":"source_check_pending","legacy":{"ID":"A005","Домен":"Онтология","Модуль аргумента":"Аргумент первичной дисфункции","Вывод":"Жизнь создаёт нужду и уязвимость, а потом выдаёт обслуживание нужды за благо процесса.","Посылки/цепь":"Дефицит → потребность → временное удовлетворение → новый дефицит/угроза.","Типовое возражение":"В жизни есть удовольствия.","Как усилить":"Признать удовольствия как реальные, но показать, что они отвечают на созданную нужду.","Источник":"Objective Value","Главы книги":"Глава 20"}},{"id":"wiki:A006","validation":"source_check_pending","legacy":{"ID":"A006","Домен":"Онтология","Модуль аргумента":"Аргумент объективных проблем/ошибок","Вывод":"Система, которая создаёт вред ради решения созданных ею же нужд, является объективной проблемой/ошибкой.","Посылки/цепь":"Система производит нужду; носитель может быть повреждён; функция не равна оправданию.","Типовое возражение":"Это просто естественный процесс.","Как усилить":"Развести объяснение происхождения и оправдание продолжения.","Источник":"Philosophy Arena","Главы книги":"Глава 21"}},{"id":"wiki:A007","validation":"source_check_pending","legacy":{"ID":"A007","Домен":"Этика","Модуль аргумента":"Аргумент асимметрии","Вывод":"Несозданный не лишается блага, но созданный может быть повреждён, лишён и поставлен в риск.","Посылки/цепь":"Нет субъекта - нет лишения; создание создаёт субъекта нужды.","Типовое возражение":"Мы лишаем будущих людей счастья.","Как усилить":"Показать, что лишение требует субъекта, которому хуже.","Источник":"Objective Value; FAQ","Главы книги":"Глава 29"}},{"id":"wiki:A008","validation":"source_check_pending","legacy":{"ID":"A008","Домен":"Этика","Модуль аргумента":"Аргумент согласия","Вывод":"Невозможность получить согласие на создание уязвимого субъекта не даёт права создавать его без согласия.","Посылки/цепь":"Действие создаёт другого; другой несёт последствия; согласия быть не может.","Типовое возражение":"Нельзя спросить, значит это не проблема.","Как усилить":"Показать, что невозможность согласия повышает, а не снижает требование к оправданию.","Источник":"FAQ + Шиффрин как внешняя опора","Главы книги":"Глава 24"}},{"id":"wiki:A009","validation":"source_check_pending","legacy":{"ID":"A009","Домен":"Этика","Модуль аргумента":"Аргумент предохранителя","Вывод":"Если невозможно гарантировать защиту от катастрофического вреда, запуск нового носителя риска не оправдан.","Посылки/цепь":"Риск создаётся для другого; худший исход необратим; гарантий нет.","Типовое возражение":"Большинство жизней нормальные.","Как усилить":"Большинство не отменяет реальность меньшинства и невозместимый вред.","Источник":"Objective Value; Philosophy Arena","Главы книги":"Глава 27"}},{"id":"wiki:A010","validation":"source_check_pending","legacy":{"ID":"A010","Домен":"Этика/Будущее","Модуль аргумента":"Антиутопический аргумент","Вывод":"Будущее благо не даёт права создавать жертв пути к нему.","Посылки/цепь":"Прогресс возможен, но не гарантирован; жертвы не дали согласия; риск dual-use.","Типовое возражение":"Нужно продолжать ради будущего.","Как усилить":"Развести локальный прогресс и оправдание производства новых носителей риска.","Источник":"FAQ; Objective Value","Главы книги":"Глава 48"}},{"id":"wiki:A011","validation":"source_check_pending","legacy":{"ID":"A011","Домен":"Этика/Будущее","Модуль аргумента":"Аргумент неднк чувствительности","Вывод":"Если возможна искусственная или иная чувствительность, критерий должен быть сентиентность, а не биологическая форма.","Посылки/цепь":"Субстрат может различаться; отрицательная валентность остаётся реальным событием.","Типовое возражение":"Эфилизм только против ДНК.","Как усилить":"Показать ДНК как земной случай более общего класса.","Источник":"Philosophy Arena; Objective Value","Главы книги":"Глава 46"}},{"id":"wiki:A012","validation":"source_check_pending","legacy":{"ID":"A012","Домен":"Практика","Модуль аргумента":"Аргумент частичных решений","Вывод":"Веганизм, экология, гуманитарная помощь снижают вред, но не доказывают право производить новых носителей вреда.","Посылки/цепь":"Помощь существующим ≠ оправдание создания новых.","Типовое возражение":"Раз можно помогать, жизнь оправдана.","Как усилить":"Отделить обязанность помощи от права запускать новые нужды.","Источник":"Philosophy Arena; FAQ","Главы книги":"Глава 39, 42"}}],"examples":[{"ID":"U001","Контекст использования":"Глава 'Истина и утешение'","Типовой триггер":"Оппонент: 'это всё субъективно'","Как использовать":"Показать разрыв между интерпретацией и событием опыта.","Короткая формула":"Можно ошибаться о причине боли, но не отменить факт пережитой боли.","Связанные понятия":"C002, C023","Источник":"Objective Value"},{"ID":"U002","Контекст использования":"Глава 'Что такое эфилизм'","Типовой триггер":"Нужно объяснить широту позиции","Как использовать":"Начать с абсолютного антинатализма, затем раскрыть инфраструктуру: атеология, материализм, сентиентность, риск.","Короткая формула":"Эфилизм не просто бездетность, а запрет на создание новых носителей отрицательной валентности.","Связанные понятия":"C014, C027","Источник":"FAQ"},{"ID":"U003","Контекст использования":"Глава 'Атеологическая реальность'","Типовой триггер":"Оппонент: 'всё имеет высший смысл'","Как использовать":"Спросить, где проверяемый механизм компенсации и защиты.","Короткая формула":"Скрытый смысл не является предохранителем от реальной агонии.","Связанные понятия":"C013, C032","Источник":"Philosophy Arena"},{"ID":"U004","Контекст использования":"Глава 'Детерминизм против фатализма'","Типовой триггер":"Оппонент: 'если всё причинно, ничего не изменить'","Как использовать":"Развести детерминированность и неизменность.","Короткая формула":"Причинные системы меняются через причины; аргумент тоже причина.","Связанные понятия":"C010, C011","Источник":"Philosophy Arena"},{"ID":"U005","Контекст использования":"Глава 'ДНК-жизнь'","Типовой триггер":"Нужно не заузить проблему до биологии","Как использовать":"Сказать, что ДНК - земной механизм, но критерий проблемы - производство сентиентного риска.","Короткая формула":"Если другой субстрат создаёт боль, он подпадает под тот же анализ.","Связанные понятия":"C017, C018","Источник":"Philosophy Arena"},{"ID":"U006","Контекст использования":"Глава 'Первичная дисфункция'","Типовой триггер":"Нужно показать структуру нужды","Как использовать":"Собрать цепь: жизнь создаёт дефицит → временно его чинит → снова создаёт уязвимость.","Короткая формула":"Лекарство важно для больного, но не оправдывает создание болезни.","Связанные понятия":"C021","Источник":"Objective Value"},{"ID":"U007","Контекст использования":"Глава 'Объективные проблемы/ошибки'","Типовой триггер":"Нужно определить технический узел","Как использовать":"Не разделять проблему и ошибку слишком жёстко; показать их как две стороны одного механизма.","Короткая формула":"Система производит нужду и риск, а затем требует обслуживания.","Связанные понятия":"C022","Источник":"Philosophy Arena"},{"ID":"U008","Контекст использования":"Глава 'Бремя доказательства'","Типовой триггер":"Оппонент требует доказать невоспроизводство","Как использовать":"Вернуть нагрузку на запускающего риск.","Короткая формула":"Отказ не создаёт жертву; создание может создать жертву.","Связанные понятия":"C006, C029, C031","Источник":"Objective Truth"},{"ID":"U009","Контекст использования":"Глава 'Отсутствие предохранителя'","Типовой триггер":"Оппонент: 'мы будем любить ребёнка'","Как использовать":"Развести снижение риска и гарантию безопасности.","Короткая формула":"Любовь может помогать, но не гарантирует защиту от катастрофического вреда.","Связанные понятия":"C032","Источник":"Objective Value; Philosophy Arena"},{"ID":"U010","Контекст использования":"Глава 'Критика утопизма'","Типовой триггер":"Оппонент: 'будущее всё исправит'","Как использовать":"Спросить, кто дал право создавать возможных жертв ради будущего.","Короткая формула":"Прогресс не является ретроактивным согласием пострадавшего.","Связанные понятия":"C034","Источник":"FAQ; Objective Value"},{"ID":"U011","Контекст использования":"Глава 'Информационная работа'","Типовой триггер":"Нужно показать практический выход","Как использовать":"Аргумент как причина будущего невоспроизводства вреда.","Короткая формула":"Метакогниция позволяет разуму стать аудитором биологической программы.","Связанные понятия":"C005, C037","Источник":"Objective Truth; FAQ"},{"ID":"U012","Контекст использования":"Ответ критикам эфилизма","Типовой триггер":"Оппонент атакует тон источника","Как использовать":"Отделить риторику от причинной структуры аргумента.","Короткая формула":"Нас интересует не агрессивный язык, а цепь: субстрат → сентиентность → вред → риск → бремя доказательства.","Связанные понятия":"Все ключевые","Источник":"Все источники"}],"sources":[{"ID":"S001","Файл":"Objective Value","Раздел/страница":"Objective Value","Что извлекаем":"Объективная ценность, феноменология, отрицательная валентность, асимметрия несоздания, double-action failsafe.","URL":"https://web.archive.org/web/20220304232657/https://efilism.fandom.com/wiki/Objective_Value","Как исполь ентрическую оценку причинных условий; стрелки лестницы подписать по типу связи.","part":"IV"},{"chapter":25,"title":"Глава 25. Значимость без космической цели","pdf_start":207,"pdf_end":212,"printed_start":206,"words":2345,"function":"Сохранить значимость в бесцельном мире","strength":"Конечность и отсутствие космической миссии не обесценивают локальные интересы.","gap":"21 и 25 местами объявляют мозг единственным генератором ценности во Вселенной, хотя допускается иной субстрат.","recommendation":"Использовать субъект переживания как общий носитель; мозг оставить установленным земным примером.","part":"V"},{"chapter":26,"title":"Глава 26. Положительный опыт: благо или устранение нехватки?","pdf_start":212,"pdf_end":219,"printed_start":211,"words":3387,"function":"Проверить депривационализм","strength":"Реальные радости, неожиданная музыка и запрет тавтологической депривации уже включены.","gap":"Общая ось предпочтений не доказывает необходимую способность страдать; поздний образ наркотической ломки сильнее ранних уступок.","recommendation":"Разделить регуляторную обусловленность, феноменальный знак и нормативное основание создания; добавить ветвь обучения, укрепляющую защиту.","part":"V"},{"chapter":27,"title":"Глава 27. Сознание без гарантии безопасности","pdf_start":219,"pdf_end":226,"printed_start":218,"words":3076,"function":"Описать безопасность и крайние исходы","strength":"Риск не смешан с реализацией; статистика снабжена полезными ограничениями; компенсация признаётся реальной.","gap":"Отсутствие гарантии становится функциональной бесполезностью любых благ; профиль крайнего вреда не измерен приведёнными диагнозами.","recommendation":"Сохранить динамическую хрупкость как ограничение гарантий; отдельно показать снижение риска благами и измерение крайних состояний.","part":"V"},{"chapter":28,"title":"Глава 28. Рациональность как коррекция","pdf_start":227,"pdf_end":233,"printed_start":226,"words":2832,"function":"Объяснить практическую рациональность","strengt ости за дальнейшие поколения.","part":"VII"},{"chapter":32,"title":"Глава 32. Достаточное основание создания и минимальное ядро эфилизма","pdf_start":252,"pdf_end":260,"printed_start":251,"words":3486,"function":"Сформулировать центральный вывод","strength":"Четырёхпосылочная схема честно называет посылку 3 самостоятельным нормативным шарниром.","gap":"32.5 не доказывает внутреннего краха агрегационизма; восемь положений и приложение задают другую силу порога.","recommendation":"Оставить схему 32.4.2 канонической; переписать 32.5 как нормативное сопоставление; привести все пересказы к одной модели.","part":"VII"},{"chapter":33,"title":"Глава 33. Абсолютный антинатализм","pdf_start":260,"pdf_end":274,"printed_start":259,"words":6364,"function":"Проверить охват и сильные альтернативы","strength":"Лучший реалистический случай, несравнительное благо и неидентичность рассмотрены; граница без страдания названа открыто.","gap":"Предъявление собственного порога не является независимым опровержением конкурирующего порога; абсолютность имеет несколько смыслов.","recommendation":"Свести разногласия по каждой теории к точной посылке; закрепить смысл абсолютности и явный статус опекунского конфликта.","part":"VII"},{"chapter":34,"title":"Глава 34. Психологическая защита продолжения","pdf_start":277,"pdf_end":288,"printed_start":276,"words":5198,"function":"Объяснить защиту убеждений","strength":"Генетическая ошибка прямо запрещена и предусмотрена самопроверка автора.","gap":"Поздние психологические обобщения рискуют превратить несогласие в диагноз.","recommendation":"Для каждого механизма указать, что он предсказывает и как проверяется; применить симметричные тесты к собственной группе.","part":"VIII"},{"chapter":35,"title":"Глава 35. Продолжение как социальная норма","pdf_start":288,"pdf_end":298,"printed_start":287,"words":4672,"function":"Проверить социальную норму","strength":"Различены частный мотив и институциональные интересы.","gap":"Молчание академии объявлено следствием выгод и страха, а контрактные суммы смешиваются с субсидиями.","recommendation":"Проверить каждый эмпирический кейс первичными данными; вынести датируемую публицистику из несущего доказательства.","part":"VIII"},{"chapter":36,"title":"Глава 36. Как проверять аргументы в пользу рождения","pdf_start":298,"pdf_end":303,"printed_start":297,"words":2287,"function":"Дать процедуру разбора доводов","strength":"Адресаты выгод, временная привязка и скрытые переходы выделены удачно.","gap":"Любая критика объявляется уловкой, если не принимает рамку четырёх посылок; это закрывает внешний аудит самой рамки.","recommendation":"Разрешить возражения к понятиям, полноте вариантов и выводу; в конце главы проверять таким же способом собственные доводы.","part":"IX"},{"chapter":37,"title":"Глава 37. Близость без гарантии","pdf_start":303,"pdf_end":307,"printed_start":302,"words":1989,"function":"Развести близость и гарантию","strength":"Любовь признана сильным защитным фактором и самостоятельным благом для живущих.","gap":"Метафора заложников сужает отношения к принуждению и плохо согласуется с признанным положительным содержанием.","recommendation":"Сохранить двойную роль близости и отделить способность к утрате от вывода об общей ценности отношений.","part":"IX"},{"chapter":38,"title":"Глава 38. Наследие, последнее поколение и красота","pdf_start":307,"pdf_end":312,"printed_start":306,"words":2785,"function":"Разобрать наследие и последнее поколение","strength":"Нет долга нерождённых обслуживать предшественников; красота и конечность совместимы.","gap":"Объяснение происхождения капкана не снимает обязанность оценить вред предлагаемого перехода.","recommendation":"Связать каждый ответ с конкретными условиями главы 44; оставить нерешённые вопросы как исследовательские задачи.","part":"IX"},{"chapter":39,"title":"Глава 39. Дикая природа без романтизации","pdf_start":314,"pdf_end":319,"printed_start":313,"words":2863,"function":"Расширить внимание на диких животных","strength":"Признаны положительные состояния и отсутствие общей надёжной суммы благополучия биосферы.","gap":"Количество ранних смертей не устанавливает объём пережитого страдания без данных о сентиентности и времени опыта.","recommendation":"Разделить вид, возраст, длительность переживания и неопределённость; использовать этот осторожный стандарт и в главах 23–24.","part":"X"},{"chapter":40,"title":"Глава 40. Вмешательство в дикую природу: помощь без инженерной самоуверенности","pdf_start":320,"pdf_end":323,"printed_start":319,"words":1206,"function":"Проверить компетентность помощи","strength":"Диагноз не считается рецептом; сравниваются действие, бездействие и побочные последствия.","gap":"Глава существенно короче планетарных обещаний, для которых должна задавать доказательный стандарт.","recommendation":"Расширить оценку исходов, мониторинг и право остановки; сделать её фильтр обязательным для глав 44–47.","part":"X"},{"chapter":41,"title":"Глава 41. Помощь существующим и границы частичных мер","pdf_start":324,"pdf_end":329,"printed_start":323,"words":2170,"function":"Соединить помощь и профилактику","strength":"Есть границы личной ответственности; частичные меры прямо признаются полезными.","gap":"41.2.4 выводит тройную вилку, не оставляющую места обоснованному несогласию с конкретной стратегией.","recommendation":"Различить ограниченную область работы и претензию на полное решение; убрать психологическое объяснение любого отказа от максимальной программы.","part":"XI"},{"chapter":42,"title":"Глава 42. Право на выход: автономия, способность к решению и границы защитной опеки","pdf_start":329,"pdf_end":336,"printed_start":328,"words":3581,"function":"Защитить автономию при необратимом решении","strength":"Есть функциональная способность, временная защита и внимание к социальной брошенности.","gap":"42.1.2 не опровергает теорию лишения; 42.1.1 смешивает этическое равенство нового опыта с риторикой того же Я.","recommendation":"Переписать спор о смерти через альтернативные биографии; сохранять самостоятельную ценность живущего и двусторонность необратимой ошибки.","part":"XI"},{"chapter":43,"title":"Глава 43. Медицинская автономия и заблаговременное волеизъявление","pdf_start":337,"pdf_end":340,"printed_start":336,"words":1274,"function":"Продолжить авторство при утрате способности","strength":"Отказ от вмешательства отделён от отказа в уходе; есть представитель и разбор конфликтов.","gap":"Юридическая обязательность предварительной воли зависит от юрисдикции и вида решения.","recommendation":"Разнести общую этическую модель и юридические примеры; не выдавать любой предварительный документ за универсальную правовую гарантию.","part":"XI"},{"chapter":44,"title":"Глава 44. Демографический переход: сокращение воспроизводства без обрушения институтов","pdf_start":340,"pdf_end":345,"printed_start":339,"words":2504,"function":"Оценить переход без обрушения","strength":"Производительность, распределение и инфраструктура рассмотрены совместно.","gap":"Доля исследователей, автоматизация и демографическая инерция не гарантируют сохранение всей сети науки и ухода.","recommendation":"Заменить доказанное решение сценарной моделью с чувствительностью к темпу снижения, производительности и узким местам поддержки.","part":"XI"},{"chapter":45,"title":"Глава 45. Прогресс, интеллект и ошибочная цель","pdf_start":347,"pdf_end":356,"printed_start":346,"words":3934,"function":"Проверить усиление ошибочной цели","strength":"Разведены техническая мощность и этическое качество; разобраны известные механизмы ошибок оптимизации.","gap":"Интеллектуальная мощность не гарантирует эфилистический вывод; двойное назначение не доказывает симметричную мощность любого инструмента.","recommendation":"Чётко отделить риск, универсальную невозможность и авторский сценарий; не сертифицировать несентиентность четырьмя эвристиками.","part":"XII"},{"chapter":46,"title":"Глава 46. Универсальный критерий и границы гарантии","pdf_start":356,"pdf_end":364,"printed_start":355,"words":3800,"function":"Ограничить глобальную гарантию","strength":"Универсальность заботы не смешана с причинной властью; стазис назван граничным концептом.","gap":"Далее BAAN и вычислительные масштабы используются как подтверждение неизбежного решения.","recommendation":"Сохранить предельную амбицию с явным индексом домена, времени и модели; использовать BAAN в исходном статусе мысленного теста.","part":"XII"},{"chapter":47,"title":"Глава 47. Конечный ориентир и предохранительная стратегия","pdf_start":365,"pdf_end":372,"printed_start":364,"words":3628,"function":"Перевести ориентир в стратегию","strength":"Предусмотрены ненасилие, сохранение возможностей и барьер против необратимой власти.","gap":"47.3.2 объявляет препятствием лишь отсутствие мандата вопреки 46.2; исторические масштабы не подтверждают готовность полного решения.","recommendation":"Переписать дорожную карту в форме проверяемых этапов с критериями допуска и отказа; убрать нерелевантные энергетические аналогии.","part":"XII"},{"chapter":48,"title":"Глава 48. Полевой метод эфилистического анализа","pdf_start":373,"pdf_end":385,"printed_start":372,"words":5884,"function":"Сделать обсуждение воспроизводимым","strength":"Фиксация тезиса, роли, посылок и журнал возражений полезны для реальных дискуссий.","gap":"Термины цехового снобизма и роевого мышления могут блокировать содержательный внешний контроль.","recommendation":"Для каждого ответа предусмотреть возможность признать ошибку своей посылки; закончить книгу журналом открытых вопросов и критериев пересмотра.","part":"XII"}],"book_parts":[{"id":"I","title":"Реальность истина и дисциплина вывода","first":1,"last":4},{"id":"II","title":"Мир без гаранта","first":5,"last":13},{"id":"III","title":"Жизнь без проекта","first":14,"last":19},{"id":"IV","title":"Субъект переживания и объективная проблемность","first":20,"last":24},{"id":"V","title":"Значимость положительный опыт и безопасность","first":25,"last":27},{"id":"VI","title":"Рациональность и нормативный мост"," function wrap(t,max=28){let lines=[''];for(let w of t.split(/\s+/)){let i=lines.length-1;if((lines[i]+' '+w).trim().length>max&&lines[i])lines.push(w);else lines[i]=(lines[i]+' '+w).trim()}return lines.slice(0,3)}

((l,i)=>`<tspan x="${x}" dy="${i?14:0}">${esc(l)}</tspan>`).join('')}</text></g>`}).join('');$('drawing').innerHTML=`<svg viewBox="0 0 800 ${h}" xmlns="http://www.w3.org/2000/svg" aria-label="Граф ближайших связей">${defs}${links}${boxes}</svg>`;$('graphNote').textContent=`${es.length} связей · ${near.length} из ${by.size} соседних узлов показано. Нажмите на узел, чтобы перейти к нему. Пунктир — сопоставление, проблемный переход, тематическая или отложенная для проверки связь.`;$('legend').innerHTML=[...new Set(es.map(e=>e.type))].map(k=>`<span><i class="dot" style="background:${colors[k]}"></i>${esc(D.relation_types[k])}</span>`).join('');$('focusTitle').innerHTML=`<small>${esc(n.id)} · ${esc(layers[n.layer])}</small><h2 style="margin:6px 0 12px">${esc(n.label)}</h2><span class="pill">${esc(status[n.validation])}</span>`;let p=n.provenance||{};$('details').innerHTML=kv('Определение',n.definition)+kv('Граница понятия (v0.4)',n.ontology_review?.boundary)+kv('Функция',n.role)+kv('Ограничение',n.limit)+kv('Происхождение',[p.artifact,p.locator,p.sources].filter(Boolean).join(' · '))+kv('Ранняя реконструкция источника',p.source_paraphrase)+(n.source_evidence?`<div class="kv"><b>Абзацная привязка</b>${esc(n.source_evidence.note)}<br><a href="Archaeologia_Efilismi.html#${encodeURIComponent(n.id)}">Открыть свидетельства (${n.source_evidence.anchors.length})</a></div>`:'')+(p.url&&/^https:\/\//.test(p.url)?`<a href="${esc(p.url)}" target="_blank" rel="noopener">Архивная ссылка на источник</a>`:'');$('relations').innerHTML=es.map(e=>{let other=e.source===selected?e.target:e.source;return `<div class="edge"><small>${esc(e.id)} · ${esc(D.relation_types[e.type])} · ${esc(e.ontology_review?.decision==='pending'?'Не проверено на этапе 0.4':status[e.validation])}</small><div>${e.source===selected?'→':'←'} <button data-id="${esc(other)}">${esc(N[other].label)}</button></div>${kv('Исходная формулировка',e.label)}${kv('Обоснование',e.explanation)}${e.note?`<div class="note">${esc(e.note)}</div>`:''}</div>`}).join('')||'<p class="muted">В выбранном фильтре связей нет.</p>'}
$('arguments').innerHTML=D.arguments.map(a=>{let r=a.legacy;return `<div class="panel"><small>${esc(a.id)} · ${esc(r['Домен'])} · не проверено</small><h3>${esc(r['Модуль аргумента'])}</h3>${Object.entries(r).filter(([k])=>!['ID','Домен','Модуль аргумента'].includes(k)).map(([k,v])=>kv(k,v)).join('')}</div>`}).join('');$('audit').innerHTML='<div class="panel"><h2>Статус проверки</h2><p><a href="Ontologia_Efilismi.html">Открыть новый аудит v0.4: 72 понятия, 34 сопоставления, 73 связи.</a> 13 исключённых из графа рёбер сохранены в JSON.</p><p>Структурная проверка: уникальность ID, наличие обоих концов ребра и объявленного типа. Содержательная проверка не завершена.</p><h3>Приоритеты</h3><ol><li>E006: конфликт C025 и репродуктивной свободы.</li><li>E005: отсутствует ID цели.</li><li>C023: разделить ноцицепцию и отрицательную валентность.</li><li>E013–E015: различить феноменологический факт, оценку, нормативную посылку и вывод.</li><li>Проверить все 34 сопоставления с первоисточниками и последней редакцией книги.</li></ol></div>'+D.book_issues.map(i=>`<div class="panel"><small>Импорт замечания ноябрьского аудита · ${esc(i.id)}</small><h3>${esc(i.title)}</h3>${kv('Проблема',i.problem)}${kv('Предложенное исправление',i.fix)}${kv('Локатор',i.where)}</div>`).join('');$('sources').innerHTML='<div class="panel"><h2>Происхождение</h2><p>Слои не объединены автоматически. Wiki — ранняя реконструкция. Для 37 понятий добавлены абзацные ссылки; новые узлы выделены в слое Archaeologia. Монография — импорт из ноябрьской HTML-карты, не проверка актуальной рукописи. Аналитическая реконструкция — отдельные узлы и замечания аудита.</p><p>Граф отображает ближайших соседей, а не доказывает философские положения. Упоминания исключены из фильтра по умолчанию.</p></div>'+D.sources.map(r=>`<div class="panel"><h3>${esc(r['Файл'])}</h3>${kv('Извлекаемый материал',r['Что извлекаем'])}<a target="_blank" rel="noopener" href="${esc(r.URL)}">Архив Wiki</a></div>`).join('');document.addEventListener('click',e=>{let x=e.target.closest('[data-id]');if(x)select(x.dataset.id);let t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===t));['graph','arguments','audit','sources'].forEach(k=>$(k).classList.toggle('hide',k!==t.dataset.tab))}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg g[data-id]')){e.preventDefault();select(e.target.dataset.id)}});['q','layer','kind'].forEach(k=>$(k).addEventListener(k==='q'?'input':'change',renderList));['type','dir'].forEach(k=>$(k).addEventListener('change',renderGraph));select(selected);
</script></html>
